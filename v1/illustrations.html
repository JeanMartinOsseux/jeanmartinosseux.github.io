<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Illustrations — Jean Martin Osseux</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,Verdana,sans-serif}body{background:#242321 url('./assets/illustrations/ILLUS_FOND.png') center center / cover no-repeat fixed;color:#fff}.museum{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:65px 32px 90px}.wall{display:flex;align-items:center;justify-content:center;gap:0;width:min(1100px,95vw)}.painting{appearance:none;position:relative;display:block;flex:none;width:min(86vw,980px);height:min(78vh,780px);border:0;background:transparent;padding:0;cursor:pointer;filter:drop-shadow(3px 7px 8px #0009);transition:transform .2s}.painting:hover{transform:scale(1.035)}.painting .artwork{position:absolute;left:var(--inset-x,12%);top:var(--inset-y,12%);width:calc(100% - 2 * var(--inset-x,12%));height:calc(100% - 2 * var(--inset-y,12%));object-fit:contain;background:transparent}.painting .frame{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}.controls{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:20px;background:#161616d9;padding:10px 16px;border-radius:8px;white-space:nowrap}.controls button,.home{font:inherit;background:#f1eee5;border:1px solid #999;border-radius:4px;padding:8px 12px;cursor:pointer;color:#111}.home{position:fixed;top:16px;left:16px;text-decoration:none;background:#161616d9;color:#fff;border-color:#aaa8}.count{min-width:60px;text-align:center}@media(max-width:650px){.museum{padding:70px 12px 100px}.wall{gap:0}.painting{max-width:92vw;max-height:72vh}.controls{gap:9px;padding:8px}.controls button{padding:7px}}</style></head><body><a class="home" href="./index.html">← Bureau</a><main class="museum"><div class="wall" id="wall" aria-label="Œuvres accrochées au mur"></div></main><nav class="controls" aria-label="Navigation des illustrations"><button id="prev">← Précédent</button><span id="count" class="count"></span><button id="next">Suivant →</button></nav><script>
const artworks=["allin.jpg","bagarre  tout.jpg","bagarre all.jpg","BLEDcolo.jpg","casino.jpg","ecran.jpg","enfant seul.jpg","fegeff.png","illu insta.jpg","illuinsta.jpg","INSTA1.jpg","INSTA2.jpg","INSTA6.jpg","MAGICUS AND GUN1.jpg","MRSTEAKGREBIK.png","MRSTEAKGREBIK2.png","portrait alt.jpg","portugall.jpg","pose.jpg","RATNORM.jpg","sketch.jpg","tapisserie post insta.jpg","truc cool boutique.jpg"];let index=0;const wall=document.getElementById('wall'),count=document.getElementById('count');
function draw(){wall.replaceChildren();for(let i=0;i<1;i++){const name=artworks[index];const button=document.createElement('button');button.className='painting';button.title='Illustration suivante';button.setAttribute('aria-label','Illustration : '+name);const img=document.createElement('img');img.className='artwork';img.src='./assets/illustrations/ILLUS/'+encodeURIComponent(name);img.alt=name;const frame=document.createElement('img');frame.className='frame';frame.src='./assets/illustrations/CADRE'+(index%3+1)+'.png';frame.alt='';button.append(img,frame);img.onload=()=>{const model=index%3;const margins=[{x:.105,y:.11},{x:.12,y:.13},{x:.145,y:.145}][model];button.style.setProperty('--inset-x',(margins.x*100)+'%');button.style.setProperty('--inset-y',(margins.y*100)+'%');const innerRatio=img.naturalWidth/img.naturalHeight;const outerRatio=innerRatio*(1-2*margins.y)/(1-2*margins.x);const maxW=Math.min(window.innerWidth*.88,1050),maxH=Math.min(window.innerHeight*.78,790);const w=Math.min(maxW,maxH*outerRatio);button.style.width=w+'px';button.style.height=(w/outerRatio)+'px'};button.addEventListener('click',()=>{index=(index+1)%artworks.length;draw()});wall.append(button)}count.textContent=(index+1)+' / '+artworks.length}
document.getElementById('prev').onclick=()=>{index=(index-1+artworks.length)%artworks.length;draw()};document.getElementById('next').onclick=()=>{index=(index+1)%artworks.length;draw()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')document.getElementById('next').click();if(e.key==='ArrowLeft')document.getElementById('prev').click()});draw();
</script></body></html>
