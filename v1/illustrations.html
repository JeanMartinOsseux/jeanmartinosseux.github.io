<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Illustrations — Jean Martin Osseux</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,Verdana,sans-serif}body{background:#242321 url('./assets/illustrations/ILLUS_FOND.png') center center / cover no-repeat fixed;color:#fff}.museum{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:65px 32px 90px}.wall{display:flex;align-items:center;justify-content:center;gap:0;width:min(1100px,95vw)}.painting{appearance:none;position:relative;display:block;flex:none;width:min(86vw,980px);height:min(78vh,780px);border:0;background:transparent;padding:0;cursor:pointer;filter:drop-shadow(3px 7px 8px #0009);transition:transform .2s}.painting:hover{transform:scale(1.035)}.painting .artwork{position:absolute;left:var(--inset-x,12%);top:var(--inset-y,12%);width:calc(100% - 2 * var(--inset-x,12%));height:calc(100% - 2 * var(--inset-y,12%));object-fit:contain;background:transparent}.painting .frame{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}.controls{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:20px;background:#161616d9;padding:10px 16px;border-radius:8px;white-space:nowrap}.controls button,.home{font:inherit;background:#f1eee5;border:1px solid #999;border-radius:4px;padding:8px 12px;cursor:pointer;color:#111}.home{position:fixed;top:16px;left:16px;text-decoration:none;background:#161616d9;color:#fff;border-color:#aaa8}.count{min-width:60px;text-align:center}@media(max-width:650px){.museum{padding:70px 12px 100px}.wall{gap:0}.painting{max-width:92vw;max-height:72vh}.controls{gap:9px;padding:8px}.controls button{padding:7px}}.painting .composite{display:block;width:100%;height:100%;object-fit:fill}.lightbox{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;padding:3vh 3vw;cursor:zoom-out}.lightbox.open{display:flex}.lightbox img{display:block;max-width:100%;max-height:94vh;object-fit:contain}.lightbox-close{position:absolute;right:18px;top:15px;color:white;background:#222;border:1px solid #aaa;border-radius:6px;font:inherit;font-size:23px;cursor:pointer;padding:5px 12px}
/* Boutons et chiffres dessinés : cadrage de la partie non transparente des PNG */
.controls{background:transparent;gap:13px;padding:5px}
.controls button,.home{border:0;background:transparent;color:transparent;padding:0;display:flex;align-items:center;justify-content:center;overflow:visible}
.controls button{width:138px;height:47px}
.home{width:130px;height:47px}
.controls button:hover,.home:hover{filter:brightness(1.2);transform:scale(1.035)}
.prop-crop{position:relative;display:inline-block;width:100%;height:100%;overflow:hidden;pointer-events:none}
.prop-crop img{position:absolute;max-width:none;object-fit:fill;pointer-events:none}
.count{display:flex;align-items:center;justify-content:center;gap:2px;min-width:95px;height:40px}
.count .prop-crop{width:24px;height:32px;flex:none}
.count .slash{width:13px;height:31px}
@media(max-width:650px){.controls button{width:94px;height:35px}.count{min-width:78px}.count .prop-crop{width:18px;height:26px}.count .slash{width:10px;height:25px}.home{width:105px;height:38px}}
</style></head><body><a class="home" href="./index.html">← Bureau</a><main class="museum"><div class="wall" id="wall" aria-label="Œuvres accrochées au mur"></div></main><nav class="controls" aria-label="Navigation des illustrations"><button id="prev">← Précédent</button><span id="count" class="count"></span><button id="next">Suivant →</button></nav><div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Illustration agrandie"><button class="lightbox-close" id="lightbox-close" aria-label="Fermer">×</button><img id="lightbox-image" alt=""></div><script>

const PROP_ROOT='https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/PROPS/';
function prop(name,bounds,cls=''){const [x,y,w,h]=bounds;const box=document.createElement('span');box.className='prop-crop '+cls;const img=document.createElement('img');img.alt='';img.src=PROP_ROOT+name;img.style.cssText='left:'+(-x/w*100)+'%;top:'+(-y/h*100)+'%;width:'+(1920/w*100)+'%;height:'+(1080/h*100)+'%';box.append(img);return box}
const digitBounds={1:[715,208,352,485],23:[608,223,572,463]};
const digitNames={};for(let n=1;n<=25;n++)digitNames[n]='PROPS_'+String(74-n).padStart(4,'0')+'_'+n+'.png';
function numberArt(n){const fragment=document.createDocumentFragment();for(const d of String(n)){if(d===' ')continue;const value=Number(d);if(value===0){const fallback=document.createElement('span');fallback.textContent='0';fallback.style.color='white';fragment.append(fallback);continue}const file=digitNames[value];const bounds=digitBounds[value]||[550,180,650,560];fragment.append(prop(file,bounds))}return fragment}
const prevArt=prop('PROPS_0076_PRECEDANT.png',[252,255,1508,565]);const nextArt=prop('PROPS_0075_SUIVANT.png',[227,176,1527,581]);const homeArt=prop('PROPS_0077_BUREAU.png',[240,240,1431,514]);
document.getElementById('prev').replaceChildren(prevArt);document.getElementById('next').replaceChildren(nextArt);document.querySelector('.home').replaceChildren(homeArt);
const artworks=["allin.jpg","bagarre  tout.jpg","bagarre all.jpg","BLEDcolo.jpg","casino.jpg","ecran.jpg","enfant seul.jpg","fegeff.png","illu insta.jpg","illuinsta.jpg","INSTA1.jpg","INSTA2.jpg","INSTA6.jpg","MAGICUS AND GUN1.jpg","MRSTEAKGREBIK.png","MRSTEAKGREBIK2.png","portrait alt.jpg","portugall.jpg","pose.jpg","RATNORM.jpg","sketch.jpg","tapisserie post insta.jpg","truc cool boutique.jpg"];let index=0;const wall=document.getElementById('wall'),count=document.getElementById('count');
function measureOpening(frame,model){
 const c=document.createElement('canvas');c.width=frame.naturalWidth;c.height=frame.naturalHeight;
 const context=c.getContext('2d',{willReadFrequently:true});context.drawImage(frame,0,0);
 const {data}=context.getImageData(0,0,c.width,c.height),w=c.width,h=c.height;
 const transparent=(x,y)=>data[(y*w+x)*4+3]<18;
 const cx=Math.floor(w/2),cy=Math.floor(h/2);
 if(!transparent(cx,cy))return null;
 let l=cx,r=cx,t=cy,b=cy;
 while(l>0&&transparent(l-1,cy))l--;
 while(r<w-1&&transparent(r+1,cy))r++;
 while(t>0&&transparent(cx,t-1))t--;
 while(b<h-1&&transparent(cx,b+1))b++;
 if(r-l<w*.35||b-t<h*.35)return null;
 // Take the transparent central rectangle; leave one pixel clear of ornamentation.
 return {x:l+1,y:t+1,w:r-l-1,h:b-t-1};
}
function draw(){
 wall.replaceChildren();
 const name=artworks[index],model=index%3;
 const button=document.createElement('button');button.className='painting';
 button.title='Agrandir cette illustration';button.setAttribute('aria-label','Illustration : '+name);
 const canvas=document.createElement('canvas');canvas.className='composite';
 button.append(canvas);wall.append(button);
 const art=new Image(),frame=new Image();let loaded=0;
 const render=()=>{
  if(++loaded!==2)return;
  const fw=frame.naturalWidth,fh=frame.naturalHeight;
  let bounds;
  try{bounds=measureOpening(frame,model)}catch(e){bounds=null}
  if(!bounds){
   const presets=[{x:.125,y:.225,w:.75,h:.55},{x:.135,y:.225,w:.73,h:.55},{x:.145,y:.22,w:.71,h:.56}];
   const p=presets[model];bounds={x:p.x*fw,y:p.y*fh,w:p.w*fw,h:p.h*fh};
  }
  // Scale frame's outer rectangle to make its opening match the original art ratio.
  const ratio=(art.naturalWidth/art.naturalHeight)*(bounds.h/bounds.w);
  const maxW=Math.min(innerWidth*.96,1400),maxH=Math.min(innerHeight*.86,1050);
  const width=Math.min(maxW,maxH*ratio),height=width/ratio;
  button.style.width=width+'px';button.style.height=height+'px';
  canvas.width=Math.round(fw);canvas.height=Math.round(fh);
  const ctx=canvas.getContext('2d');
  // Artwork is drawn ONLY in the frame opening, never outside its edges.
  ctx.drawImage(frame,0,0,fw,fh);
  // Draw artwork last, clipped precisely to the measured opening so the frame cannot cover its edges.
  ctx.save();ctx.beginPath();ctx.rect(bounds.x,bounds.y,bounds.w,bounds.h);ctx.clip();
  ctx.drawImage(art,bounds.x,bounds.y,bounds.w,bounds.h);ctx.restore();
 };
 art.onload=render;frame.onload=render;
 art.src='./assets/illustrations/ILLUS/'+encodeURIComponent(name);
 frame.src='./assets/illustrations/CADRE'+(model+1)+'.png';
 button.onclick=()=>openLightbox(name);
 count.replaceChildren(numberArt(index+1),prop('PROPS_0074__.png',[788,324,147,380],'slash'),numberArt(artworks.length));
}
const lightbox=document.getElementById('lightbox'),lightboxImage=document.getElementById('lightbox-image');
function openLightbox(name){lightboxImage.src='./assets/illustrations/ILLUS/'+encodeURIComponent(name);lightboxImage.alt=name;lightbox.classList.add('open');document.body.style.overflow='hidden';document.getElementById('lightbox-close').focus()}
function closeLightbox(){lightbox.classList.remove('open');lightboxImage.removeAttribute('src');document.body.style.overflow=''}
lightbox.addEventListener('click',closeLightbox);document.getElementById('lightbox-close').addEventListener('click',closeLightbox);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&lightbox.classList.contains('open'))closeLightbox()});
document.getElementById('prev').onclick=()=>{index=(index-1+artworks.length)%artworks.length;draw()};document.getElementById('next').onclick=()=>{index=(index+1)%artworks.length;draw()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')document.getElementById('next').click();if(e.key==='ArrowLeft')document.getElementById('prev').click()});draw();
</script></body></html>
