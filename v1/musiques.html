/* PDM V31 — center the complete two-video row relative to the viewport */
#pdm .pdm-videos{position:relative!important;left:50%!important;transform:translateX(-50%)!important;margin:12px 0 16px!important;justify-content:center!important}
#pdm .pdm-title img{height:clamp(205px,31vh,350px)!important;max-width:min(980px,92vw)!important}
#pdm .pdm-title{margin:0!important}
@media(max-width:700px){#pdm .pdm-videos{left:50%!important;transform:translateX(-50%)!important}#pdm .pdm-title img{height:clamp(145px,23vh,220px)!important}}

/* PDM V32: fit the whole PDM screen in the viewport, no vertical scrolling */
html:has(#pdm:not(.hidden)),body:has(#pdm:not(.hidden)){height:100%;overflow:hidden!important}
#pdm:not(.hidden){height:100dvh!important;min-height:0!important;max-height:100dvh!important;overflow:hidden!important;padding:70px 20px 16px!important;box-sizing:border-box!important}
#pdm .pdm-links{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;max-height:100%;padding:0!important}
#pdm .pdm-title img{height:clamp(95px,22dvh,245px)!important}
#pdm .pdm-videos{width:min(1050px,88vw)!important;margin:6px 0 8px!important}
#pdm .pdm-social{margin-top:4px!important}
#pdm .pdm-social a.pdm-social-prop{width:min(180px,20vw)!important}
@media(max-height:760px){#pdm .pdm-title img{height:clamp(75px,17dvh,145px)!important}#pdm .pdm-videos{width:min(880px,80vw)!important}#pdm .pdm-social a.pdm-social-prop{width:135px!important}}

/* PDM V33 — slightly larger title and social props, still within one screen */
#pdm .pdm-title img{height:clamp(115px,25dvh,275px)!important}
#pdm .pdm-social a.pdm-social-prop{width:min(215px,24vw)!important}
@media(max-height:760px){#pdm .pdm-title img{height:clamp(90px,20dvh,175px)!important}#pdm .pdm-social a.pdm-social-prop{width:160px!important}}
@media(max-width:700px){#pdm .pdm-title img{height:clamp(95px,19dvh,175px)!important}#pdm .pdm-social a.pdm-social-prop{width:min(175px,37vw)!important}}
/* Exclu CD: override the global multiply blending that hid the black disc */
#jeanma .cd-art.exclusive{mix-blend-mode:normal!important;opacity:1!important;display:block!important;visibility:visible!important;z-index:3!important;background:#080808!important;animation:cdspin 2.2s linear infinite!important;animation-play-state:paused!important}
#jeanma .cd-art.exclusive.playing{animation-play-state:running!important}
#jeanma .cd-art.exclusive img{display:block!important;width:100%!important;height:100%!important;object-fit:cover!important}

/* Mobile landscape album picker */
@media(pointer:coarse) and (orientation:landscape) and (max-width:950px){#jeanma #albums{grid-template-columns:repeat(3,minmax(0,1fr))!important;grid-template-rows:repeat(2,minmax(0,1fr))!important;gap:2px 12px!important;overflow:hidden!important;align-items:center!important}#jeanma .album-button{grid-column:auto!important;grid-row:auto!important;width:100%!important;max-width:100%!important;height:100%!important;min-height:0!important;gap:2px!important;justify-content:center!important;overflow:hidden!important}#jeanma .album-button img{width:auto!important;height:min(24dvh,100px)!important;max-width:100%!important;aspect-ratio:1!important;flex-shrink:1!important}#jeanma .album-button span{font-size:clamp(9px,1.35vw,13px)!important;line-height:1.1!important;max-width:100%!important;text-align:center!important}#jeanma .panel{overflow:hidden!important}}
/* Center the two discs beneath the first three */
#jeanma #albums{grid-template-columns:repeat(6,minmax(0,1fr))!important;grid-template-rows:repeat(2,minmax(0,1fr))!important}
#jeanma #albums .album-button:nth-child(1){grid-column:1 / span 2!important;grid-row:1!important}
#jeanma #albums .album-button:nth-child(2){grid-column:3 / span 2!important;grid-row:1!important}
#jeanma #albums .album-button:nth-child(3){grid-column:5 / span 2!important;grid-row:1!important}
#jeanma #albums .album-button:nth-child(4){grid-column:2 / span 2!important;grid-row:2!important}
#jeanma #albums .album-button:nth-child(5){grid-column:4 / span 2!important;grid-row:2!important}
@media(pointer:coarse) and (orientation:landscape) and (max-width:950px){#jeanma #albums{grid-template-columns:repeat(6,minmax(0,1fr))!important;grid-template-rows:repeat(2,minmax(0,1fr))!important}}
</style></head><body><a class="back" href="./index.html">← Bureau</a>
<section class="screen" id="choice"><div class="choice"><img src="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/music/CHOIX.png" alt="Choix entre Prisonniers du Micro et DJ JeanMa" onerror="this.style.display='none'"><button class="pdm" aria-label="Prisonniers du Micro" onclick="show('pdm')">PDM</button><button class="jeanma" aria-label="DJ JeanMa" onclick="show('jeanma')">DJ JeanMa</button></div><div class="fallback"><button onclick="show('pdm')">Prisonniers du Micro</button><button onclick="show('jeanma')">DJ JeanMa</button></div></section>
<section class="screen music hidden" id="jeanma"><div class="art-frame"><div class="choice-button-mask"></div><div class="detail-title-mask"></div><div class="drawn-transport"><button id="draw-prev" aria-label="Morceau précédent"></button><button id="draw-play" aria-label="Lecture"></button><button id="draw-pause" aria-label="Pause"></button><button id="draw-next" aria-label="Morceau suivant"></button></div></div><div class="player-layout"><div class="deck"><img src="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/music/CDPLAYER.png" alt="Lecteur CD"><div class="cd-art" id="cd-art"><img id="cover" alt="Pochette du disque"></div></div><div class="panel"><div id="albums"></div><div id="player-detail" class="hidden"><div id="album-heading" class="album-heading"></div><div id="playlist"></div><div class="nowplaying" id="nowplaying">Sélectionne un disque</div><audio id="audio" controls preload="none"></audio><div class="transport hidden"><button id="previous" aria-label="Piste précédente">⏮ Précédent</button><button id="next" aria-label="Piste suivante">Suivant ⏭</button></div></div></div><div class="music-actions"><button id="back-albums" class="hidden" onclick="backToAlbums()" aria-label="Retour aux disques"></button><button id="back-choice-music" onclick="musicChoiceAction()" aria-label="Retour au choix musical"></button></div></div></section>
<section class="screen pdm-screen hidden" id="pdm"><button class="pdm-choice-top" type="button" onclick="show('choice')" aria-label="Retour au choix PDM ou DJ JeanMa"></button><div class="pdm-links"><h1 class="pdm-title"><img src="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/PROPS/PDM/PROPS_0017_PDM.png" alt="Prisonniers du Micro"></h1><div class="pdm-videos"><div class="pdm-clip"><iframe src="https://www.youtube-nocookie.com/embed/XTmM7M4Q3FI" title="Prisonniers du Micro — vidéo 1" loading="lazy" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe><img class="pdm-clip-frame" src="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/PROPS/PDM/PROPS_0016_CADRE-CLIP.png" alt="" aria-hidden="true"></div><div class="pdm-clip"><iframe src="https://www.youtube-nocookie.com/embed/AY1q6CbuNyE" title="Prisonniers du Micro — vidéo 2" loading="lazy" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe><img class="pdm-clip-frame" src="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/PROPS/PDM/PROPS_0016_CADRE-CLIP.png" alt="" aria-hidden="true"></div></div><div class="pdm-social"><a class="pdm-social-prop" href="https://soundcloud.com/prisonniers-du-micro" target="_blank" rel="noopener noreferrer" aria-label="Prisonniers du Micro sur SoundCloud"><img src="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/PROPS/PDM/PROPS_0015_SC-PDM.png" alt="SoundCloud"></a><a class="pdm-social-prop" href="https://www.youtube.com/@PrisonniersduMicro" target="_blank" rel="noopener noreferrer" aria-label="Prisonniers du Micro sur YouTube"><img src="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/PROPS/PDM/PROPS_0014_YT-PDM.png" alt="YouTube"></a></div></div></section>
<script>
const base="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/music/",albums=[{"title":"Окружающий мир","dir":"projet_1","tracks":["окружающий мир.mp3"]},{"title":"Freestyle de la Soirusse bénite","dir":"projet_2","tracks":["freestyle de la soirusse bénite.mp3"]},{"title":"Monologue du Troisième État","dir":"projet_3","tracks":["00 intro.mp3","1 - ya rodilsya.mp3","2 - cherniy youmor .mp3","3 - muravied.mp3","3.5 - interlude 1.mp3","4 - talkie walking.mp3","4.5 - 2 edulretni.mp3","5 - nature étoilée .mp3","6 - kaleidoscope.mp3","7 - blessures soignées.mp3","zz - outro.mp3"]},{"title":"Réflexions sur l'État Post-Tiers","dir":"projet_4","tracks":["0 - intro.mp3","1 - en mode c'est bien la bas.mp3","2 - doublon d'une pate terne (feat. Pyotross).mp3","3 - edit of the doesn't matter (feat. Big LR).mp3","4 - voskresofon (feat. souche).mp3","5 - prosnulsya v psihushke.mp3","6 - outro.mp3"]}];
const audio=document.getElementById('audio'),cover=document.getElementById('cover'),cd=document.getElementById('cd-art'),albumBox=document.getElementById('albums'),playlist=document.getElementById('playlist'),now=document.getElementById('nowplaying');
let albumIndex=-1,trackIndex=-1;
function url(path){return base+path.split('/').map(encodeURIComponent).join('/')}
function show(id){if(id!=='jeanma')audio.pause();document.querySelectorAll('section.screen').forEach(el=>el.classList.toggle('hidden',el.id!==id));if(id==='jeanma')backToAlbums()}
function musicChoiceAction(){if(document.getElementById('jeanma').classList.contains('album-open'))backToAlbums();else show('choice')}
function backToAlbums(){audio.pause();document.getElementById('jeanma').classList.remove('album-open');document.getElementById('albums').classList.remove('hidden');document.getElementById('player-detail').classList.add('hidden');document.getElementById('back-albums').classList.add('hidden')}
function selectAlbum(i){audio.pause();document.getElementById('jeanma').classList.add('album-open');document.getElementById('albums').classList.add('hidden');document.getElementById('player-detail').classList.remove('hidden');document.getElementById('back-albums').classList.remove('hidden');albumIndex=i;trackIndex=-1;cd.classList.toggle('exclusive',i===4);cover.src=i===4?url('CDTOURNE.png'):url(albums[i].dir+'/pochette.jpg');albumBox.querySelectorAll('button').forEach((b,j)=>b.classList.toggle('selected',i===j));playlist.replaceChildren();const songs=i===4?['Exclu']:albums[i].tracks;const wrap=document.createElement('div');wrap.className='playlist';songs.forEach((name,j)=>{const b=document.createElement('button');b.className='song-button';b.textContent=(j+1)+'. '+name.replace(/\.mp3$/i,'');b.onclick=()=>selectTrack(j);wrap.append(b)});playlist.append(wrap);document.getElementById("album-heading").textContent=i===4?"Exclu":albums[i].title;now.textContent="Choisis une piste";audio.removeAttribute('src');audio.load()}
function selectTrack(j){if(albumIndex<0)return;const isExclu=albumIndex===4;const name=isExclu?'exclu.mp3':albums[albumIndex].tracks[j];trackIndex=j;audio.src=url(isExclu?name:albums[albumIndex].dir+'/'+name);now.textContent=(isExclu?'Exclu':albums[albumIndex].title)+' — '+name.replace(/\.mp3$/i,'');playlist.querySelectorAll('button').forEach((b,k)=>b.classList.toggle('selected',k===j));audio.play().catch(()=>{})}
function move(delta){if(albumIndex<0)return;const length=albumIndex===4?1:albums[albumIndex].tracks.length;if(trackIndex<0){selectTrack(0);return}selectTrack((trackIndex+delta+length)%length)}
audio.addEventListener('play',()=>cd.classList.add('playing'));['pause','ended','emptied'].forEach(ev=>audio.addEventListener(ev,()=>cd.classList.remove('playing')));audio.addEventListener('ended',()=>{const length=albumIndex===4?1:albums[albumIndex].tracks.length;if(trackIndex+1<length)selectTrack(trackIndex+1)});
document.getElementById('previous').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);
document.getElementById('draw-prev').onclick=()=>move(-1);
document.getElementById('draw-next').onclick=()=>move(1);
document.getElementById('draw-play').onclick=()=>{if(trackIndex<0)selectTrack(0);else audio.play().catch(()=>{})};
document.getElementById('draw-pause').onclick=()=>audio.pause();
const propRoot='https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/PROPS/';
function buttonArt(file,b){const [x,y,w,h]=b;const span=document.createElement('span');span.className='prop-crop';const img=document.createElement('img');img.alt='';img.src=propRoot+file;img.style.cssText=`left:${-x/w*100}%;top:${-y/h*100}%;width:${1920/w*100}%;height:${1080/h*100}%`;span.append(img);return span}
document.getElementById('back-albums').replaceChildren();
document.getElementById('back-choice-music').replaceChildren();
[...albums,{title:'Exclu',dir:null}].forEach((a,i)=>{const b=document.createElement('button');b.className='album-button';const img=document.createElement('img');img.src=i===4?url('CDTOURNE.png'):url(a.dir+'/pochette.jpg');img.alt='';const label=document.createElement('span');label.textContent=a.title;b.append(img,label);b.onclick=()=>selectAlbum(i);albumBox.append(b)});
</script></body></html>
