<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Musiques — Jean Martin Osseux</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111;color:white;font-family:Tahoma,Verdana,sans-serif}button,a{cursor:pointer;font:inherit}.back{position:fixed;top:14px;left:14px;z-index:5;background:#222;color:#fff;border:1px solid #aaa;padding:9px 13px;text-decoration:none;border-radius:5px}.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:75px 20px 35px}.hidden{display:none!important}.choice{width:min(950px,94vw);position:relative;aspect-ratio:16/9;background:#27212e}.choice img{width:100%;height:100%;object-fit:contain}.choice button{position:absolute;top:0;width:50%;height:100%;border:0;background:transparent;color:transparent}.choice button:hover,.choice button:focus-visible{outline:3px solid #fff;outline-offset:-3px;background:#ffffff17}.choice .pdm{left:0}.choice .jeanma{right:0}.fallback{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.fallback button{background:#ece9d8;color:#111;padding:12px 18px;border:2px outset white}.music{background:#111 url('./assets/music/CDFOND.png') center/cover no-repeat fixed}.player-layout{width:min(1080px,96vw);display:grid;grid-template-columns:minmax(250px,1fr) minmax(250px,1fr);gap:30px;align-items:center}.deck{position:relative;min-height:300px;display:grid;place-items:center;background:rgba(0,0,0,.2)}.deck>img{width:100%;max-height:70vh;object-fit:contain}.disc{position:absolute;width:46%;aspect-ratio:1;object-fit:contain;top:50%;left:50%;transform:translate(-50%,-50%);animation:spin 2.2s linear infinite;animation-play-state:paused;filter:drop-shadow(0 2px 5px #000a)}.disc.playing{animation-play-state:running}@keyframes spin{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}.panel{background:#101010d9;border:1px solid #888;padding:20px;max-height:80vh;overflow:auto}.panel h1{margin:0 0 14px}.track{display:block;width:100%;margin:7px 0;text-align:left;padding:12px;background:#e6e1d2;border:2px outset white;color:#111}.track.selected{background:#b6d4ff}iframe{border:0;width:100%;height:166px;margin-top:15px}.note{font-size:12px;color:#ccc}.pdm-screen{background:#111 url('./assets/music/PDM_BG.png') center/cover no-repeat}.pdm-links{background:#111d;padding:25px;max-width:700px;text-align:center}.pdm-links a{display:block;color:#fff;margin:14px;padding:12px;border:1px solid #aaa}.back-choice{margin-top:20px;background:#eee;border:0;padding:10px 15px;color:#111}@media(max-width:700px){.player-layout{grid-template-columns:1fr}.deck{min-height:220px}.panel{max-height:none}}
</style></head><body><a class="back" href="./index.html">← Bureau</a>
<section class="screen" id="choice"><div class="choice"><img src="./assets/music/CHOIX.png" alt="Choix entre Prisonniers du Micro et DJ JeanMa" onerror="this.style.display='none'"><button class="pdm" aria-label="Prisonniers du Micro" onclick="show('pdm')">PDM</button><button class="jeanma" aria-label="DJ JeanMa" onclick="show('jeanma')">DJ JeanMa</button></div><div class="fallback"><button onclick="show('pdm')">Prisonniers du Micro</button><button onclick="show('jeanma')">DJ JeanMa</button></div></section>
<section class="screen music hidden" id="jeanma"><div class="player-layout"><div class="deck"><img src="./assets/music/CDPLAYER.png" alt="Lecteur CD" onerror="this.style.opacity='.25'"><img class="disc" id="disc" src="./assets/music/CDTOURNE.png" alt="CD en rotation"></div><div class="panel"><h1>DJ JeanMa</h1><p>Choisis un disque :</p><div id="tracks"></div><div id="widget-holder"></div><p class="note">Le disque tourne pendant la lecture SoundCloud. Les contrôles audio sont dans le lecteur intégré.</p><button class="back-choice" onclick="show('choice')">← Choix musical</button></div></div></section>
<section class="screen pdm-screen hidden" id="pdm"><div class="pdm-links"><h1>Prisonniers du Micro</h1><a href="https://soundcloud.com/prisonniers-du-micro" target="_blank" rel="noopener">SoundCloud</a><a href="https://www.youtube.com/@PrisonniersduMicro" target="_blank" rel="noopener">YouTube</a><a href="https://youtu.be/XTmM7M4Q3FI" target="_blank" rel="noopener">Vidéo 1</a><a href="https://youtu.be/AY1q6CbuNyE" target="_blank" rel="noopener">Vidéo 2</a><button class="back-choice" onclick="show('choice')">← Choix musical</button></div></section>
<script src="https://w.soundcloud.com/player/api.js"></script><script>
const songs=[['Окружающий мир','https://soundcloud.com/djjeanma-75865563/okruzhayushhij-mir'],['Freestyle de la Soirusse','https://soundcloud.com/djjeanma-75865563/freestyle-de-la-soirusse'],['Monologue du Troisième État','https://soundcloud.com/djjeanma-75865563/sets/monologue-du-troiseme-etat'],['Réflexions sur l’État Post-Tiers','https://soundcloud.com/djjeanma-75865563/sets/reflexions-sur-letat-post']];
let widget=null,chosen=-1;const disc=document.getElementById('disc'),holder=document.getElementById('widget-holder');
function stop(){if(widget)try{widget.pause()}catch(e){}disc.classList.remove('playing')}
function show(id){if(id!=='jeanma')stop();for(const el of document.querySelectorAll('section.screen'))el.classList.toggle('hidden',el.id!==id)}
function selectSong(i){stop();chosen=i;document.querySelectorAll('.track').forEach((b,j)=>b.classList.toggle('selected',i===j));holder.replaceChildren();const iframe=document.createElement('iframe');iframe.title='Lecteur SoundCloud : '+songs[i][0];iframe.allow='autoplay';iframe.src='https://w.soundcloud.com/player/?url='+encodeURIComponent(songs[i][1])+'&color=%23ff5500&auto_play=false&show_artwork=true';holder.append(iframe);widget=null;if(window.SC&&SC.Widget){const w=SC.Widget(iframe);widget=w;w.bind(SC.Widget.Events.PLAY,()=>{if(widget===w)disc.classList.add('playing')});for(const ev of [SC.Widget.Events.PAUSE,SC.Widget.Events.FINISH])w.bind(ev,()=>{if(widget===w)disc.classList.remove('playing')})}}
const tracks=document.getElementById('tracks');songs.forEach((s,i)=>{const b=document.createElement('button');b.className='track';b.textContent=(i+1)+'. '+s[0];b.onclick=()=>selectSong(i);tracks.append(b)});
</script></body></html>
