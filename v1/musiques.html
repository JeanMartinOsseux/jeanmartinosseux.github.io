<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Musiques — Jean Martin Osseux</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111;color:white;font-family:Tahoma,Verdana,sans-serif}button,a{cursor:pointer;font:inherit}.back{position:fixed;top:14px;left:14px;z-index:5;background:#222;color:#fff;border:1px solid #aaa;padding:9px 13px;text-decoration:none;border-radius:5px}.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:75px 20px 35px}#choice{padding:0}.hidden{display:none!important}.choice{width:100vw;height:100vh;position:relative;background:#000}.choice img{width:100%;height:100%;object-fit:fill}.choice button{position:absolute;top:0;width:50%;height:100%;border:0;background:transparent;color:transparent}.choice button:hover,.choice button:focus-visible{outline:5px solid #fff;outline-offset:-5px;background:#ffffff12}.choice .jeanma:hover,.choice .jeanma:focus-visible{outline-color:#000;background:#00000010}.choice .pdm{left:0}.choice .jeanma{right:0}.fallback{display:none;gap:10px;justify-content:center;flex-wrap:wrap}.fallback button{background:#ece9d8;color:#111;padding:12px 18px;border:2px outset white}.music{background:#111 url('https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/music/CDFOND.png') center/cover no-repeat fixed}.player-layout{width:min(1080px,96vw);display:grid;grid-template-columns:minmax(250px,1fr) minmax(250px,1fr);gap:30px;align-items:center}.deck{position:relative;min-height:300px;display:grid;place-items:center;background:transparent}.deck>img{width:100%;max-height:70vh;object-fit:contain}.disc{position:absolute;width:39%;aspect-ratio:1;border-radius:50%;object-fit:cover;top:43%;left:48%;transform:translate(-50%,-50%);animation:spin 2.2s linear infinite;animation-play-state:paused;filter:drop-shadow(0 2px 5px #000a);clip-path:circle(50%)}.disc.playing{animation-play-state:running}@keyframes spin{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}.panel{background:#101010d9;border:1px solid #888;padding:20px;max-height:80vh;overflow:auto}.panel h1{margin:0 0 14px}.track{display:block;width:100%;margin:7px 0;text-align:left;padding:12px;background:#e6e1d2;border:2px outset white;color:#111}.track.selected{background:#b6d4ff}iframe{border:0;width:100%;height:166px;margin-top:15px}.note{font-size:12px;color:#ccc}.pdm-screen{background:#000 url('https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/music/PDM_BG.png') center/100% 100% no-repeat}.pdm-links{background:transparent;padding:25px;max-width:1000px;width:100%;text-align:center}.pdm-videos{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:24px 0}.pdm-videos iframe{width:100%;height:auto;aspect-ratio:16/9;border:1px solid white;background:#000}.pdm-social{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;margin-top:18px}.pdm-social a{display:inline-block!important;background:#111c}.pdm-links a{display:block;color:#fff;margin:14px;padding:12px;border:1px solid #aaa}.back-choice{margin-top:20px;background:#eee;border:0;padding:10px 15px;color:#111}@media(max-width:700px){.pdm-videos{grid-template-columns:1fr}.player-layout{grid-template-columns:1fr}.deck{min-height:220px}.panel{max-height:none}}
.cd-art{position:absolute;top:44%;left:50%;width:61%;aspect-ratio:1;transform:translate(-50%,-50%) scaleY(.86);border-radius:50%;overflow:hidden;background:transparent;animation:cdspin 2.2s linear infinite;animation-play-state:paused;mix-blend-mode:multiply;opacity:.88}.cd-art.playing{animation-play-state:running}.cd-art.exclusive{mix-blend-mode:normal;opacity:1}.cd-art img{width:100%;height:100%;object-fit:cover;display:block}.cd-art:after{content:"";position:absolute;left:50%;top:50%;width:13%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#111 0 35%,#b9b9b9 38% 70%,#222 73%);box-shadow:0 0 0 2px #7778}@keyframes cdspin{from{transform:translate(-50%,-50%) scaleY(.86) rotate(0)}to{transform:translate(-50%,-50%) scaleY(.86) rotate(360deg)}}.album-button{display:flex;align-items:center;gap:10px;width:100%;margin:6px 0;padding:7px;border:1px solid #aaa;background:#eee;color:#111;text-align:left}.album-button img{width:46px;height:46px;object-fit:cover}.album-button.selected,.song-button.selected{background:#b6d4ff}.song-button{display:block;width:100%;padding:8px;text-align:left;border:1px solid #aaa;background:#e6e1d2;color:#111;margin:4px 0}.playlist{max-height:170px;overflow:auto;margin:12px 0}.nowplaying{margin-top:12px;font-weight:bold;font-size:14px}#audio{display:block;width:100%;margin-top:10px}.transport{display:flex;gap:10px;margin-top:10px}.transport button{flex:1;padding:8px;background:#eee;color:#111;border:1px solid #aaa}
/* V19 — fixed 1920x1080 composition; scaled together */
#jeanma.music{position:relative;display:block;width:100vw;height:100vh;min-height:0;overflow:hidden;padding:0}
#jeanma .player-layout{position:absolute;inset:0;width:100%;height:100%;display:block}
#jeanma .art-frame{position:absolute;left:18%;top:2%;width:64%;height:96%;background:url('https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/PROPS/MUSIQUES_P1.png') center/100% 100% no-repeat;pointer-events:none}
#jeanma .art-frame .choice-button-mask,#jeanma .art-frame .detail-title-mask{display:none!important}
#jeanma .panel{position:absolute;left:23%;top:29%;width:54%;height:40%;padding:0;margin:0;border:0;background:transparent;box-shadow:none;overflow:hidden;display:block;max-height:none}
#jeanma #albums{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;width:100%;height:100%}
#jeanma .album-button{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;width:100%;height:100%;min-width:0;padding:8px 3px;margin:0;background:#eee;border:1px solid #aaa;color:#111;text-align:center;font-size:clamp(10px,.85vw,16px);overflow:hidden}
#jeanma .album-button img{width:78%;height:auto;max-height:52%;aspect-ratio:1;object-fit:contain}
#jeanma .album-button:last-child img{background:#000}
#jeanma .album-button span{overflow-wrap:anywhere}
#jeanma .deck{display:none;position:absolute;left:5%;top:19%;width:39%;height:76%;min-height:0;background:none;place-items:center}
#jeanma .deck>img{width:100%;height:100%;object-fit:contain}
#jeanma .cd-art{position:absolute;left:50%;top:43%;width:59%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;mix-blend-mode:multiply;opacity:.88;animation:cdspin 2.2s linear infinite;animation-play-state:paused}
#jeanma .cd-art.playing{animation-play-state:running}
#jeanma.album-open .art-frame{left:52%;top:9%;width:42%;height:82%;background-image:url('https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/PROPS/MUSIQUES_P2.png')}
#jeanma.album-open .deck{display:grid}
#jeanma.album-open .panel{left:57%;top:29%;width:32%;height:43%;overflow:hidden}
#jeanma #player-detail{display:flex;flex-direction:column;justify-content:center;gap:6px;width:100%;height:100%;min-width:0;overflow:hidden}
#jeanma #player-detail.hidden{display:none}
#jeanma #playlist{min-height:0;overflow:hidden}
#jeanma .playlist{max-height:26vh;overflow:auto;margin:0}
#jeanma .song-button{display:block;width:100%;padding:6px 8px;margin:2px 0;background:#e6e1d2;color:#111;border:1px solid #aaa;text-align:left;font-size:clamp(11px,.85vw,16px)}
#jeanma .nowplaying{font-size:12px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#111}
#jeanma #audio{display:block;width:100%;height:42px;margin:0}
#jeanma .transport{display:none!important}
#jeanma .drawn-transport{display:none;position:absolute;inset:0;pointer-events:none}
#jeanma.album-open .drawn-transport{display:block}
#jeanma .drawn-transport button{position:absolute;top:81%;height:12%;width:11%;border:0;background:transparent;pointer-events:auto;cursor:pointer}
#jeanma #draw-prev{left:22%}#jeanma #draw-play{left:37%}#jeanma #draw-pause{left:51%}#jeanma #draw-next{left:65%}
.back{position:fixed;left:20px;top:10px;z-index:100;width:215px;height:78px;padding:0!important;border:0!important;background:transparent!important;color:transparent!important;font-size:0!important}
.back:before{content:"";position:absolute;inset:0;background:url('https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/PROPS/PROPS_0077_BUREAU.png') center/contain no-repeat}
#jeanma .music-actions{position:fixed;left:250px;top:10px;z-index:100;display:block}
#jeanma .music-actions #back-albums{display:none!important}
#jeanma .music-actions button{position:relative;width:215px;height:78px;padding:0;border:0;background:transparent;color:transparent;font-size:0;cursor:pointer}
#jeanma .music-actions button:before{content:"";position:absolute;inset:0;background:url('https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/PROPS/PROPS_0031_CHOIX.png') center/contain no-repeat}
</style></head><body><a class="back" href="./index.html">← Bureau</a>
<section class="screen" id="choice"><div class="choice"><img src="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/music/CHOIX.png" alt="Choix entre Prisonniers du Micro et DJ JeanMa" onerror="this.style.display='none'"><button class="pdm" aria-label="Prisonniers du Micro" onclick="show('pdm')">PDM</button><button class="jeanma" aria-label="DJ JeanMa" onclick="show('jeanma')">DJ JeanMa</button></div><div class="fallback"><button onclick="show('pdm')">Prisonniers du Micro</button><button onclick="show('jeanma')">DJ JeanMa</button></div></section>
<section class="screen music hidden" id="jeanma"><div class="art-frame"><div class="choice-button-mask"></div><div class="detail-title-mask"></div><div class="drawn-transport"><button id="draw-prev" aria-label="Morceau précédent"></button><button id="draw-play" aria-label="Lecture"></button><button id="draw-pause" aria-label="Pause"></button><button id="draw-next" aria-label="Morceau suivant"></button></div></div><div class="player-layout"><div class="deck"><img src="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/music/CDPLAYER.png" alt="Lecteur CD"><div class="cd-art" id="cd-art"><img id="cover" alt="Pochette du disque"></div></div><div class="panel"><div id="albums"></div><div id="player-detail" class="hidden"><div id="playlist"></div><div class="nowplaying" id="nowplaying">Sélectionne un disque</div><audio id="audio" controls preload="none"></audio><div class="transport hidden"><button id="previous" aria-label="Piste précédente">⏮ Précédent</button><button id="next" aria-label="Piste suivante">Suivant ⏭</button></div></div></div><div class="music-actions"><button id="back-albums" class="hidden" onclick="backToAlbums()" aria-label="Retour aux disques"></button><button id="back-choice-music" onclick="musicChoiceAction()" aria-label="Retour au choix musical"></button></div></div></section>
<section class="screen pdm-screen hidden" id="pdm"><div class="pdm-links"><h1>Prisonniers du Micro</h1><div class="pdm-videos"><iframe src="https://www.youtube-nocookie.com/embed/XTmM7M4Q3FI" title="Prisonniers du Micro — vidéo 1" loading="lazy" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe><iframe src="https://www.youtube-nocookie.com/embed/AY1q6CbuNyE" title="Prisonniers du Micro — vidéo 2" loading="lazy" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div><div class="pdm-social"><a href="https://soundcloud.com/prisonniers-du-micro" target="_blank" rel="noopener">SoundCloud</a><a href="https://www.youtube.com/@PrisonniersduMicro" target="_blank" rel="noopener">YouTube</a></div><button class="back-choice" onclick="show('choice')">← Choix musical</button></div></section>
<script>
const base="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/music/",albums=[{"title":"Окружающий мир","dir":"projet_1","tracks":["окружающий мир.mp3"]},{"title":"Freestyle de la Soirusse bénite","dir":"projet_2","tracks":["freestyle de la soirusse bénite.mp3"]},{"title":"Monologue du Troisième État","dir":"projet_3","tracks":["00 intro.mp3","1 - ya rodilsya.mp3","2 - cherniy youmor .mp3","3 - muravied.mp3","3.5 - interlude 1.mp3","4 - talkie walking.mp3","4.5 - 2 edulretni.mp3","5 - nature étoilée .mp3","6 - kaleidoscope.mp3","7 - blessures soignées.mp3","zz - outro.mp3"]},{"title":"Réflexions sur l'État Post-Tiers","dir":"projet_4","tracks":["0 - intro.mp3","1 - en mode c'est bien la bas.mp3","2 - doublon d'une pate terne (feat. Pyotross).mp3","3 - edit of the doesn't matter (feat. Big LR).mp3","4 - voskresofon (feat. souche).mp3","5 - prosnulsya v psihushke.mp3","6 - outro.mp3"]}];
const audio=document.getElementById('audio'),cover=document.getElementById('cover'),cd=document.getElementById('cd-art'),albumBox=document.getElementById('albums'),playlist=document.getElementById('playlist'),now=document.getElementById('nowplaying');
let albumIndex=-1,trackIndex=-1;
function url(path){return base+path.split('/').map(encodeURIComponent).join('/')}
function show(id){if(id!=='jeanma')audio.pause();document.querySelectorAll('section.screen').forEach(el=>el.classList.toggle('hidden',el.id!==id));if(id==='jeanma')backToAlbums()}
function musicChoiceAction(){if(document.getElementById('jeanma').classList.contains('album-open'))backToAlbums();else show('choice')}
function backToAlbums(){audio.pause();document.getElementById('jeanma').classList.remove('album-open');document.getElementById('albums').classList.remove('hidden');document.getElementById('player-detail').classList.add('hidden');document.getElementById('back-albums').classList.add('hidden')}
function selectAlbum(i){audio.pause();document.getElementById('jeanma').classList.add('album-open');document.getElementById('albums').classList.add('hidden');document.getElementById('player-detail').classList.remove('hidden');document.getElementById('back-albums').classList.remove('hidden');albumIndex=i;trackIndex=-1;cd.classList.toggle('exclusive',i===4);cover.src=i===4?url('CDTOURNE.png'):url(albums[i].dir+'/pochette.jpg');albumBox.querySelectorAll('button').forEach((b,j)=>b.classList.toggle('selected',i===j));playlist.replaceChildren();const songs=i===4?['Exclu']:albums[i].tracks;const wrap=document.createElement('div');wrap.className='playlist';songs.forEach((name,j)=>{const b=document.createElement('button');b.className='song-button';b.textContent=(j+1)+'. '+name.replace(/\.mp3$/i,'');b.onclick=()=>selectTrack(j);wrap.append(b)});playlist.append(wrap);now.textContent=albums[i].title;audio.removeAttribute('src');audio.load()}
function selectTrack(j){if(albumIndex<0)return;const isExclu=albumIndex===4;const name=isExclu?'exclu.mp3':albums[albumIndex].tracks[j];trackIndex=j;audio.src=url(isExclu?name:albums[albumIndex].dir+'/'+name);now.textContent=(isExclu?'Exclu':albums[albumIndex].title)+' — '+name.replace(/\.mp3$/i,'');playlist.querySelectorAll('button').forEach((b,k)=>b.classList.toggle('selected',k===j));audio.play().catch(()=>{})}
function move(delta){if(albumIndex<0)return;const length=albumIndex===4?1:albums[albumIndex].tracks.length;if(trackIndex<0){selectTrack(0);return}selectTrack((trackIndex+delta+length)%length)}
audio.addEventListener('play',()=>cd.classList.add('playing'));['pause','ended','emptied'].forEach(ev=>audio.addEventListener(ev,()=>cd.classList.remove('playing')));audio.addEventListener('ended',()=>{const length=albumIndex===4?1:albums[albumIndex].tracks.length;if(trackIndex+1<length)selectTrack(trackIndex+1)});
document.getElementById('previous').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);
document.getElementById('draw-prev').onclick=()=>move(-1);
document.getElementById('draw-next').onclick=()=>move(1);
document.getElementById('draw-play').onclick=()=>{if(trackIndex<0)selectTrack(0);else audio.play().catch(()=>{})};
document.getElementById('draw-pause').onclick=()=>audio.pause();
const propRoot='https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/PROPS/';
function buttonArt(file,b){const [x,y,w,h]=b;const span=document.createElement('span');span.className='prop-crop';const img=document.createElement('img');img.alt='';img.src=propRoot+file;img.style.cssText=`left:${-x/w*100}%;top:${-y/h*100}%;width:${1920/w*100}%;height:${1080/h*100}%`;span.append(img);return span}
document.getElementById('back-albums').replaceChildren();
document.getElementById('back-choice-music').replaceChildren();
[...albums,{title:'Exclu',dir:null}].forEach((a,i)=>{const b=document.createElement('button');b.className='album-button';const img=document.createElement('img');img.src=i===4?url('CDTOURNE.png'):url(a.dir+'/pochette.jpg');img.alt='';const label=document.createElement('span');label.textContent=a.title;b.append(img,label);b.onclick=()=>selectAlbum(i);albumBox.append(b)});
</script></body></html>
