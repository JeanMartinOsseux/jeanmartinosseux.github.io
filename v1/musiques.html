<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Musiques — Jean Martin Osseux</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111;color:white;font-family:Tahoma,Verdana,sans-serif}button,a{cursor:pointer;font:inherit}.back{position:fixed;top:14px;left:14px;z-index:5;background:#222;color:#fff;border:1px solid #aaa;padding:9px 13px;text-decoration:none;border-radius:5px}.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:75px 20px 35px}#choice{padding:0}.hidden{display:none!important}.choice{width:100vw;height:100vh;position:relative;background:#000}.choice img{width:100%;height:100%;object-fit:fill}.choice button{position:absolute;top:0;width:50%;height:100%;border:0;background:transparent;color:transparent}.choice button:hover,.choice button:focus-visible{outline:5px solid #fff;outline-offset:-5px;background:#ffffff12}.choice .jeanma:hover,.choice .jeanma:focus-visible{outline-color:#000;background:#00000010}.choice .pdm{left:0}.choice .jeanma{right:0}.fallback{display:none;gap:10px;justify-content:center;flex-wrap:wrap}.fallback button{background:#ece9d8;color:#111;padding:12px 18px;border:2px outset white}.music{background:#111 url('https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/music/CDFOND.png') center/cover no-repeat fixed}.player-layout{width:min(1080px,96vw);display:grid;grid-template-columns:minmax(250px,1fr) minmax(250px,1fr);gap:30px;align-items:center}.deck{position:relative;min-height:300px;display:grid;place-items:center;background:transparent}.deck>img{width:100%;max-height:70vh;object-fit:contain}.disc{position:absolute;width:39%;aspect-ratio:1;border-radius:50%;object-fit:cover;top:43%;left:48%;transform:translate(-50%,-50%);animation:spin 2.2s linear infinite;animation-play-state:paused;filter:drop-shadow(0 2px 5px #000a);clip-path:circle(50%)}.disc.playing{animation-play-state:running}@keyframes spin{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}.panel{background:#101010d9;border:1px solid #888;padding:20px;max-height:80vh;overflow:auto}.panel h1{margin:0 0 14px}.track{display:block;width:100%;margin:7px 0;text-align:left;padding:12px;background:#e6e1d2;border:2px outset white;color:#111}.track.selected{background:#b6d4ff}iframe{border:0;width:100%;height:166px;margin-top:15px}.note{font-size:12px;color:#ccc}.pdm-screen{background:#000 url('https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/music/PDM_BG.png') center/100% 100% no-repeat}.pdm-links{background:transparent;padding:25px;max-width:1000px;width:100%;text-align:center}.pdm-videos{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:24px 0}.pdm-videos iframe{width:100%;height:auto;aspect-ratio:16/9;border:1px solid white;background:#000}.pdm-social{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;margin-top:18px}.pdm-social a{display:inline-block!important;background:#111c}.pdm-links a{display:block;color:#fff;margin:14px;padding:12px;border:1px solid #aaa}.back-choice{margin-top:20px;background:#eee;border:0;padding:10px 15px;color:#111}@media(max-width:700px){.pdm-videos{grid-template-columns:1fr}.player-layout{grid-template-columns:1fr}.deck{min-height:220px}.panel{max-height:none}}
</style></head><body><a class="back" href="./index.html">← Bureau</a>
<section class="screen" id="choice"><div class="choice"><img src="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/music/CHOIX.png" alt="Choix entre Prisonniers du Micro et DJ JeanMa" onerror="this.style.display='none'"><button class="pdm" aria-label="Prisonniers du Micro" onclick="show('pdm')">PDM</button><button class="jeanma" aria-label="DJ JeanMa" onclick="show('jeanma')">DJ JeanMa</button></div><div class="fallback"><button onclick="show('pdm')">Prisonniers du Micro</button><button onclick="show('jeanma')">DJ JeanMa</button></div></section>
<section class="screen music hidden" id="jeanma"><div class="player-layout"><div class="deck"><img src="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/music/CDPLAYER.png" alt="Lecteur CD" onerror="this.style.opacity='.25'"><img class="disc" id="disc" src="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/music/CDTOURNE.png" alt="Disque en rotation"></div><div class="panel"><h1>DJ JeanMa</h1><p>Choisis un disque :</p><div id="tracks"></div><div id="widget-holder"></div><audio id="exclusive" controls style="display:none;width:100%;margin-top:15px"></audio><p class="note">Version de transition : SoundCloud pour les sorties, MP3 pour le morceau exclusif. Les pochettes et les autres MP3 viendront ensuite.</p><button class="back-choice" onclick="show('choice')">← Choix musical</button></div></div></section>
<section class="screen pdm-screen hidden" id="pdm"><div class="pdm-links"><h1>Prisonniers du Micro</h1><div class="pdm-videos"><iframe src="https://www.youtube-nocookie.com/embed/XTmM7M4Q3FI" title="Prisonniers du Micro — vidéo 1" loading="lazy" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe><iframe src="https://www.youtube-nocookie.com/embed/AY1q6CbuNyE" title="Prisonniers du Micro — vidéo 2" loading="lazy" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div><div class="pdm-social"><a href="https://soundcloud.com/prisonniers-du-micro" target="_blank" rel="noopener">SoundCloud</a><a href="https://www.youtube.com/@PrisonniersduMicro" target="_blank" rel="noopener">YouTube</a></div><button class="back-choice" onclick="show('choice')">← Choix musical</button></div></section>
<script src="https://w.soundcloud.com/player/api.js"></script><script>
const songs=[['Окружающий мир','https://soundcloud.com/djjeanma-75865563/okruzhayushhij-mir'],['Freestyle de la Soirusse','https://soundcloud.com/djjeanma-75865563/freestyle-de-la-soirusse'],['Monologue du Troisième État','https://soundcloud.com/djjeanma-75865563/sets/monologue-du-troiseme-etat'],['Réflexions sur l’État Post-Tiers','https://soundcloud.com/djjeanma-75865563/sets/reflexions-sur-letat-post'],['Exclusivité (MP3)','mp3']];
let widget=null,chosen=-1;const disc=document.getElementById('disc'),holder=document.getElementById('widget-holder'),exclusive=document.getElementById('exclusive');exclusive.addEventListener('play',()=>disc.classList.add('playing'));for(const event of ['pause','ended'])exclusive.addEventListener(event,()=>disc.classList.remove('playing'));
function stop(){if(widget)try{widget.pause()}catch(e){}exclusive.pause();disc.classList.remove('playing')}
function show(id){if(id!=='jeanma')stop();for(const el of document.querySelectorAll('section.screen'))el.classList.toggle('hidden',el.id!==id)}
function selectSong(i){stop();chosen=i;document.querySelectorAll('.track').forEach((b,j)=>b.classList.toggle('selected',i===j));holder.replaceChildren();if(songs[i][1]==='mp3'){exclusive.style.display='block';exclusive.src='https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/music/exclu.mp3';exclusive.load();return}exclusive.style.display='none';const iframe=document.createElement('iframe');iframe.title='Lecteur SoundCloud : '+songs[i][0];iframe.allow='autoplay';iframe.src='https://w.soundcloud.com/player/?url='+encodeURIComponent(songs[i][1])+'&color=%23ff5500&auto_play=false&show_artwork=true';holder.append(iframe);widget=null;if(window.SC&&SC.Widget){const w=SC.Widget(iframe);widget=w;w.bind(SC.Widget.Events.PLAY,()=>{if(widget===w)disc.classList.add('playing')});for(const ev of [SC.Widget.Events.PAUSE,SC.Widget.Events.FINISH])w.bind(ev,()=>{if(widget===w)disc.classList.remove('playing')})}}
const tracks=document.getElementById('tracks');songs.forEach((s,i)=>{const b=document.createElement('button');b.className='track';b.textContent=(i+1)+'. '+s[0];b.onclick=()=>selectSong(i);tracks.append(b)});
</script></body></html>
