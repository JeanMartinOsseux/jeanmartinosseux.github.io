<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Films — Jean Martin Osseux</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#fff;color:#111;font-family:'JMH Typewriter',monospace}
@font-face{font-family:'JMH Typewriter';src:url('https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/font/JMH%20Typewriter.otf') format('opentype');font-weight:400;font-display:swap}
@font-face{font-family:'JMH Typewriter';src:url('https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/font/JMH%20Typewriter-Bold.otf') format('opentype');font-weight:700;font-display:swap}
button{cursor:pointer;font:inherit}
.stage{position:fixed;inset:0;display:grid;place-items:center}
.poster{position:relative;width:min(720px,90vw,calc(94dvh * 780 / 1060));aspect-ratio:780/1060;overflow:hidden}
.poster>img{position:absolute;width:246.154%;height:auto;max-width:none;left:-61.538%;top:-.472%;user-select:none;pointer-events:none}
.hotspot{position:absolute;border:0;background:transparent;border-radius:8px;z-index:2}
.hotspot:hover{background:rgba(0,70,255,.09)}.hotspot:focus-visible{outline:3px dashed #ec1818;outline-offset:-4px}
.film-btn{width:39%;height:9.7%}.film-btn.left{left:4.5%}.film-btn.right{left:48.5%}
.film-btn.r1{top:8.5%}.film-btn.r2{top:19.5%}.film-btn.r3{top:30.4%}.film-btn.r4{top:41.4%}
.youtube{left:4.5%;top:55.1%;width:86%;height:29%}
.home{position:fixed;z-index:10;top:13px;left:13px;padding:8px 13px;background:#111;color:white;text-decoration:none;font-size:16px}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:20;display:none;align-items:center;justify-content:center;padding:75px 3vw 30px}
.viewer.open{display:flex}.viewer iframe{width:min(1200px,94vw);aspect-ratio:16/9;max-height:calc(100dvh - 115px);border:0;background:black}
.close{position:fixed;top:15px;right:20px;border:0;background:#111;color:white;font-size:25px;width:56px;height:48px}
@media(max-width:600px){.home{font-size:12px;padding:6px 8px}.poster{width:min(96vw,calc(90dvh * 780 / 1060))}.viewer{padding-top:55px}}
</style></head><body><a class="home" href="./index.html">← Bureau</a>
<main class="stage"><div class="poster"><img src="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/PROPS/PROPS_0013_FILMS.png" alt="Films — sélection de huit films et chaîne YouTube">
<button class="hotspot film-btn left r1" data-film="0" aria-label="Voir le film 01"></button><button class="hotspot film-btn right r1" data-film="1" aria-label="Voir le film 02"></button>
<button class="hotspot film-btn left r2" data-film="2" aria-label="Voir le film 03"></button><button class="hotspot film-btn right r2" data-film="3" aria-label="Voir le film 04"></button>
<button class="hotspot film-btn left r3" data-film="4" aria-label="Voir le film 05"></button><button class="hotspot film-btn right r3" data-film="5" aria-label="Voir le film 06"></button>
<button class="hotspot film-btn left r4" data-film="6" aria-label="Voir le film 07"></button><button class="hotspot film-btn right r4" data-film="7" aria-label="Voir le film 08"></button>
<a class="hotspot youtube" href="https://www.youtube.com/@grebik_jmo_prod/videos" target="_blank" rel="noopener noreferrer" aria-label="Ouvrir la chaîne YouTube"></a>
</div></main><div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Lecteur de film"><button class="close" id="close" aria-label="Fermer le film">✕</button><div id="player"></div></div>
<script>
const videos=["ROdMvXG-QVk","_4OawqsFceQ","D39tsIiRxV0","3Zy6nMNYn-s","CU7D2iG56eg","i0kYG8s9Sd4","K1BEPaZpkiM","goPgOHYZfRc"];
const viewer=document.getElementById('viewer'),player=document.getElementById('player');
function openFilm(n){const iframe=document.createElement('iframe');iframe.src='https://www.youtube-nocookie.com/embed/'+videos[n]+'?rel=0&autoplay=1';iframe.title='Film '+String(n+1).padStart(2,'0');iframe.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';iframe.allowFullscreen=true;player.replaceChildren(iframe);viewer.classList.add('open');document.getElementById('close').focus()}
function closeFilm(){viewer.classList.remove('open');player.replaceChildren()}
document.querySelectorAll('[data-film]').forEach(b=>b.addEventListener('click',()=>openFilm(+b.dataset.film)));
document.getElementById('close').onclick=closeFilm;viewer.addEventListener('click',e=>{if(e.target===viewer)closeFilm()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeFilm()});
</script></body></html>
