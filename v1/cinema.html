<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cinéma — Jean Martin Osseux</title><style>
*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:#151515 url('https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/films/TELEVISION_FOND.png') center/cover fixed no-repeat;font-family:Tahoma,Verdana,sans-serif;color:#111}.home{position:fixed;top:12px;left:12px;z-index:5;background:#ece9d8;border:2px outset white;padding:9px;color:#111;text-decoration:none}.room{height:100vh;display:flex;align-items:center;justify-content:center;gap:12px;padding:45px 12px 12px;overflow:hidden}.tv{width:min(1050px,76vw,calc(100vh - 62px));position:relative;flex-shrink:0;aspect-ratio:1}.tv-image{width:100%;height:100%;position:relative;z-index:2;pointer-events:none}.screen{position:absolute;left:10.5%;top:24.1%;width:61.4%;height:46.5%;background:#000;overflow:hidden;border-radius:12% / 14%;z-index:1}.screen iframe{width:100%;height:100%;border:0}.screen .blank{height:100%;display:grid;place-items:center;color:#ddd;text-align:center;padding:15px;font-size:clamp(12px,1.6vw,20px)}.panel{width:min(320px,25vw);max-height:calc(100vh - 80px);overflow:auto;background:#ece9d8;border:3px solid #1456c0;box-shadow:5px 8px 16px #0008}.titlebar{background:linear-gradient(#3984fa,#0754ce);color:#fff;padding:7px 9px;font-weight:bold}.inside{padding:12px}.film{display:block;width:100%;margin:5px 0;text-align:left;padding:8px;border:1px solid #777;background:#fff;cursor:pointer}.film.active{background:#b5d3ff}.nav{display:flex;gap:8px;margin-top:12px}.nav button{flex:1;padding:8px;cursor:pointer}.xp{margin-top:12px;border:2px solid #808080;background:#fff;padding:10px}.xp a{color:#0645ad}.xp p{margin:4px 0 8px;font-size:13px}.hint{font-size:12px;color:#555}@media(max-width:800px){.room{flex-direction:column;gap:4px;padding:50px 8px 8px}.tv{width:min(96vw,58vh)}.panel{width:min(94vw,550px);max-height:calc(42vh - 60px);min-height:120px}.screen{left:10.5%;top:24.1%;width:61.4%;height:46.5%}}
</style></head><body><a class="home" href="./index.html">← Bureau</a><main class="room"><div class="tv"><div class="screen" id="screen"><div class="blank">Sélectionne un film<br>pour allumer la télévision 📺</div></div><img class="tv-image" src="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/films/TELEVISION.png" alt="Télévision rétro"></div><aside class="panel"><div class="titlebar">📼 Cinéma — Films</div><div class="inside"><p class="hint">Les films sont dans l'ordre de ton fichier LIENS.txt.</p><div id="films"></div><div class="nav"><button id="prev">◀ Précédent</button><button id="next">Suivant ▶</button></div><div class="xp"><strong>📺 Chaîne YouTube</strong><p>Découvre d'autres films sur ma chaîne.</p><a href="https://www.youtube.com/@grebik_jmo_prod/videos" target="_blank" rel="noopener">Voir la chaîne YouTube</a></div><div class="xp"><strong>📂 Playlists</strong><p>En attente des liens de playlists.</p></div></div></aside></main><script>
const videos=["ROdMvXG-QVk","_4OawqsFceQ","D39tsIiRxV0","3Zy6nMNYn-s","CU7D2iG56eg","i0kYG8s9Sd4","K1BEPaZpkiM","goPgOHYZfRc"];let current=-1;const list=document.getElementById('films'),screen=document.getElementById('screen');function play(i){current=(i+videos.length)%videos.length;const iframe=document.createElement('iframe');iframe.src='https://www.youtube-nocookie.com/embed/'+videos[current]+'?rel=0';iframe.title='Film '+(current+1);iframe.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';iframe.allowFullscreen=true;screen.replaceChildren(iframe);document.querySelectorAll('.film').forEach((b,j)=>b.classList.toggle('active',j===current))}videos.forEach((id,i)=>{const b=document.createElement('button');b.className='film';b.textContent='Film '+String(i+1).padStart(2,'0');b.onclick=()=>play(i);list.append(b)});document.getElementById('prev').onclick=()=>play(current<0?0:current-1);document.getElementById('next').onclick=()=>play(current+1);
</script></body></html>
