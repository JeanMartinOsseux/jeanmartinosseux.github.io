/* Fenêtre dessinée: le PNG reste au premier plan, les contenus sont confinés dans son ouverture. */

.taskbar .start{height:100%;width:5.2%;min-width:55px;padding:0;border:0;background:transparent;color:transparent;font-size:0;cursor:pointer}
.taskbar .tasktitle{display:none}

/* Les deux boutons dessinés de la barre restent interactifs même écran éteint. */
#screen-off{display:none;position:fixed;inset:0;background:#000;z-index:9000}

.taskbar{z-index:9001;position:fixed}

/* Props NEW: illustrated desktop shortcuts and Grebik popup */
.desktop{grid-template-columns:repeat(2,110px);grid-auto-flow:column;grid-template-rows:repeat(6,110px);gap:8px 18px;align-content:start;padding:18px 22px;max-height:calc(100dvh - 36px)}

.shortcut .shortcut-label{font-size:12px;line-height:1.1;display:block;max-width:100%;overflow-wrap:anywhere}
.grebik-error{position:fixed;inset:0;z-index:8000;background:#0007;display:flex;align-items:center;justify-content:center;padding:20px}

/* V39 — enlarged illustrated icons, no duplicate captions; animated Grebik prop */
.desktop{grid-template-columns:repeat(2,150px)!important;grid-template-rows:repeat(6,min(120px,calc((100dvh - 55px)/6)))!important;column-gap:8px!important;row-gap:2px!important;padding:12px 16px!important}
.shortcut{width:150px!important;height:100%!important;padding:0!important}
.shortcut img.desktop-icon{width:138px!important;height:100%!important;max-height:116px!important;object-fit:contain!important}
.shortcut .shortcut-label{display:none!important}
.grebik-error img{animation:grebik-breathe 2.4s ease-in-out infinite;transform-origin:center center}
@keyframes grebik-breathe{0%,100%{transform:scale(.94)}50%{transform:scale(1.045)}}
.grebik-error button#grebik-error-close{position:absolute;top:37%;left:72%;width:9%;height:10%;padding:0;border:0;background:transparent;color:transparent;font-size:0;cursor:pointer;z-index:2}
.grebik-error{isolation:isolate}
.grebik-art{position:relative;display:inline-block;max-width:min(780px,92vw);max-height:85dvh}
.grebik-art img{max-width:100%!important;max-height:85dvh!important}
.grebik-art button#grebik-error-close{top:37%;left:72%;width:9%;height:10%}
@media(prefers-reduced-motion:reduce){.grebik-error img{animation:none}}
/* V42: animate the entire Grebik window, not only its image */
#grebik-error .grebik-art{animation:grebik-window-pulse 1.8s ease-in-out infinite!important;transform-origin:center center!important;will-change:transform}
#grebik-error .grebik-art img{animation:none!important}
@keyframes grebik-window-pulse{0%,100%{transform:scale(.90)}50%{transform:scale(1.075)}}
@media(prefers-reduced-motion:reduce){#grebik-error .grebik-art{animation:none!important}}

@media(pointer:coarse) and (orientation:landscape) and (max-width:950px){html,body{width:100%;height:100dvh;overflow:hidden}body{background-size:100% 100%;background-position:center}.window{max-height:calc(100dvh - 24px)}}
/* Mobile desktop background */
@media(pointer:coarse) and (orientation:landscape) and (max-width:950px){html,body{margin:0!important;width:100vw!important;max-width:100vw!important}body{background-size:cover!important;background-position:center!important}}

<script>
const sections=[["Poubelle","icone_1_poubelle.png","08_TEXTE"],["Illustrations","icone_2_illus.png","01_ILLUS"],["Films","icone_3_films.png","02_FILMS"],["Musiques","icone_4_musiques.png","03_MUSIQUES"],["BD","icone_5_BD.png","04_BD"],["Photos","icone_6_photos.png","05_PHOTO"],["Liens","icone_7_liens.png","06_LIENS"],["Pro","icone_8_pro.png","07_PRO"],["Carnets","icone_9_carnets.png","09_CARNETS_DE_CROQUIS"],["Zinzine Online","icone_10_zinzine.png","10_ZINZINE_ONLINE"],["Livre d'or","icone_11_livredor.png","11_LIVRE_OR"],["Grebik","icone_12_grebik.png","12_GREBIK"]];
const desktop=document.querySelector("#desktop"),win=document.querySelector("#window"),content=document.querySelector("#content");
const grebikError=document.querySelector("#grebik-error");
function closeGrebik(){grebikError.classList.add("hidden")}
document.querySelector("#grebik-error-close").onclick=closeGrebik;
grebikError.addEventListener("click",e=>{if(e.target===grebikError)closeGrebik()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeGrebik()});
for(const [name,file,id] of sections){const b=document.createElement("button");b.className="shortcut";const img=document.createElement("img");img.className="desktop-icon";img.src="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/props_new/"+file;img.alt="";const label=document.createElement("span");label.className="shortcut-label";label.textContent=name;b.append(img,label);b.title=name;b.onclick=()=>{if(id==="12_GREBIK"){grebikError.classList.remove("hidden")}else if(id==="01_ILLUS"){window.location.href="./illustrations.html"}else if(id==="03_MUSIQUES"){window.location.href="./musiques.html"}else if(id==="02_FILMS"){window.location.href="./cinema.html"}else if(id==="05_PHOTO"){window.location.href="./photos.html"}else if(id==="04_BD"){window.location.href="./bd.html"}else if(id==="08_TEXTE"){window.location.href="./textes.html"}else if(id==="09_CARNETS_DE_CROQUIS"){window.location.href="./carnets.html"}else if(id==="07_PRO"){window.location.href="./pro.html"}else if(id==="11_LIVRE_OR"){window.location.href="./livre-or.html"}else if(id==="10_ZINZINE_ONLINE"){openZinzine()}else if(id==="06_LIENS"){openLinks()}else{openSection(name,id)}};desktop.append(b)}
const artworks=["allin.jpg","bagarre  tout.jpg","bagarre all.jpg","BLEDcolo.jpg","casino.jpg","ecran.jpg","enfant seul.jpg","fegeff.png","illu insta.jpg","illuinsta.jpg","INSTA1.jpg","INSTA2.jpg","INSTA6.jpg","MAGICUS AND GUN1.jpg","MRSTEAKGREBIK.png","MRSTEAKGREBIK2.png","portrait alt.jpg","portugall.jpg","pose.jpg","RATNORM.jpg","sketch.jpg","tapisserie post insta.jpg","truc cool boutique.jpg"];
let galleryIndex=0;
function showGallery(){
 content.replaceChildren();
 const heading=document.createElement("h1");heading.textContent="Musée des illustrations";
 const room=document.createElement("div");room.className="gallery";
 const info=document.createElement("p");info.className="gallery-help";info.textContent="Clique sur un cadre pour faire défiler les œuvres.";
 const controls=document.createElement("div");controls.className="gallery-controls";
 const prev=document.createElement("button");prev.textContent="← Précédent";
 const count=document.createElement("span");count.className="gallery-caption";
 const next=document.createElement("button");next.textContent="Suivant →";
 const draw=()=>{room.replaceChildren();for(let k=0;k<3;k++){const idx=(galleryIndex+k)%artworks.length;const b=document.createElement("button");b.className="art";b.title="Changer cette œuvre";const pic=document.createElement("img");pic.className="work";pic.alt=artworks[idx];pic.src="./assets/illustrations/ILLUS/"+encodeURIComponent(artworks[idx]);const frame=document.createElement("img");frame.className="frame";frame.alt="";frame.src="./assets/illustrations/CADRE"+(k+1)+".png";b.append(pic,frame);b.onclick=()=>{galleryIndex=(galleryIndex+1)%artworks.length;draw()};room.append(b)}count.textContent=(galleryIndex+1)+" / "+artworks.length};
 prev.onclick=()=>{galleryIndex=(galleryIndex-1+artworks.length)%artworks.length;draw()};
 next.onclick=()=>{galleryIndex=(galleryIndex+1)%artworks.length;draw()};
 controls.append(prev,count,next);content.append(heading,room,controls,info);draw();
}
function openLinks(){
 document.querySelector("#windowtitle").textContent="Liens — Arbre des connexions";
 content.replaceChildren();content.style.cssText="padding:0;overflow:hidden;flex:1;background:transparent;display:flex;align-items:center;justify-content:center";content.classList.add("links-content");
 win.style.width="min(1000px,90vw)";win.style.height="min(680px,calc(100dvh - 72px))";win.style.left="50%";win.style.top="max(8px,calc((100dvh - 36px - min(680px,100dvh - 72px))/2))";win.style.transform="translateX(-50%)";
 const stage=document.createElement("div");stage.style.cssText="position:relative;width:100%;max-width:1100px;height:100%;max-height:100%;aspect-ratio:auto;flex-shrink:1;overflow:hidden;background:transparent";
 const tree=document.createElement("img");tree.src="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/liens/LIENSARBRE.png";tree.alt="Arbre des liens";tree.style.cssText="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform:scale(1.28,1.13) translateY(4%);transform-origin:center center;pointer-events:none;mix-blend-mode:screen";stage.append(tree);
 const propBase="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/PROPS/liens/";
 const links=[
 ["SoundCloud DJ JeanMa","https://soundcloud.com/djjeanma-75865563",34,38,"PROPS_0041_SOUNDCLOUD-DJ-JEANMA.png"],
 ["SoundCloud PDM","https://soundcloud.com/prisonniers-du-micro",42,27,"PROPS_0042_SOUNDCLOUD-PDM.png"],
 ["YouTube Grebik","https://www.youtube.com/@grebik_jmo_prod",53,21,"PROPS_0043_YOUTUBE-GREBIK.png"],
 ["YouTube PDM","https://www.youtube.com/@PrisonniersduMicro",62,28,"PROPS_0045_YOUTUBE-PDM.png"],
 ["Spotify DJ JeanMa","https://open.spotify.com/artist/1ewcTedZYHOdOnjtPXDIC6?si=NO1I2343RNuvSbZsRHv6eg",68,40,"PROPS_0044_SPOTIFY-DJJEANMA.png"],
 ["Instagram Grebik","https://www.instagram.com/grebikovitch/",36,53,"PROPS_0040_INSTA-GREBIK.png"],
 ["Instagram PDM","https://www.instagram.com/prisonniers_du_micro/",46,43,"PROPS_0047_INSTA-PDM.png"],
 ["Instagram On se déréalise","https://www.instagram.com/onsederealise/",60,48,"PROPS_0048_INSTA-ON-SE-DEREALISE.png"],
 ["Zinzine Online","https://fanzinzine.neocities.org/",53,35,"PROPS_0046_ZINZINE-ONLINE.png"]
 ];
 for(const [name,url,x,y,file] of links){
  const a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener noreferrer";a.title=name;a.setAttribute("aria-label",name);
