<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jean Martin Osseux — Musée numérique (V1)</title>
<style>
:root{font-family:Tahoma,Verdana,sans-serif;color:#111}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#142b35 url('https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/BG.png') center center / cover no-repeat fixed;overflow:hidden}.desktop{padding:24px;display:grid;grid-template-columns:repeat(2,100px);gap:22px}.shortcut{border:0;background:transparent;color:white;text-shadow:1px 2px 3px #000;cursor:pointer;text-align:center;padding:8px;min-height:92px}.shortcut:focus,.shortcut:hover{background:#ffffff26;outline:1px dotted #fff}.shortcut .emoji{display:block;font-size:35px;margin-bottom:8px}.window{position:absolute;top:10%;left:22%;width:min(760px,74vw);height:min(580px,72vh);background:#ece9d8;border:3px solid #1456c0;border-radius:9px 9px 0 0;box-shadow:6px 10px 28px #0008;display:flex;flex-direction:column}.titlebar{background:linear-gradient(#3984fa,#0754ce 70%,#0542ad);color:white;display:flex;align-items:center;justify-content:space-between;padding:5px 7px;cursor:move;user-select:none;font-weight:bold}.close{background:#d93c32;border:1px solid white;border-radius:3px;color:white;cursor:pointer;font-weight:bold}.content{padding:20px;overflow:auto;flex:1;background:#f7f6ee}.content h1{margin-top:0}.notice{background:#fff;border:1px solid #b7b7b7;padding:16px;margin:16px 0}.taskbar{position:fixed;bottom:0;width:100%;height:36px;background:linear-gradient(#397ff4,#1353bb);display:flex;align-items:center;color:#fff;padding:3px;gap:12px}.start{border:1px solid #9ad39d;background:linear-gradient(#55b754,#237f2d);border-radius:0 12px 12px 0;color:#fff;font-weight:bold;padding:6px 20px}.tasktitle{font-size:13px}.hidden{display:none}
.gallery{position:relative;min-height:410px;background:#202020 url('./assets/illustrations/ILLUS_FOND.png') center/cover no-repeat;display:flex;align-items:center;justify-content:space-evenly;gap:12px;padding:28px 15px}.art{width:30%;max-width:230px;aspect-ratio:3/4;position:relative;border:0;background:transparent;cursor:pointer;padding:9px;filter:drop-shadow(3px 6px 6px #0008)}.art img.work{width:100%;height:100%;object-fit:contain;background:#151515}.art img.frame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.art:hover{transform:scale(1.04)}.gallery-controls{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0}.gallery-controls button{padding:7px 13px;cursor:pointer}.gallery-caption{text-align:center;min-width:100px}.gallery-help{font-size:12px;color:#444}


/* Fenêtre dessinée: le PNG reste au premier plan, les contenus sont confinés dans son ouverture. */
.window{border:0;border-radius:0;background:transparent;box-shadow:6px 10px 28px #0005;isolation:isolate;overflow:hidden}
.window::before{display:none}
.window::after{content:"";position:absolute;z-index:4;pointer-events:none;left:-29.02%;top:-5.16%;width:147.87%;height:110.56%;background:url("https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/PROPS/PROPS_0029_FENETRES.png") center/100% 100% no-repeat}
.window .titlebar{position:relative;z-index:6;height:10%;min-height:40px;flex-shrink:0;background:transparent;color:transparent;padding:0 7%;cursor:move}
.window #windowtitle{color:transparent;pointer-events:none}
.window .close{position:absolute;z-index:7;right:6%;top:0;width:11%;height:100%;border:0;background:transparent;color:transparent;font-size:0;cursor:pointer}
.window .content{position:relative;z-index:1;flex:1;min-height:0;overflow:auto;margin:0 7% 7%;padding:12px;background:#fff}
.window .content[style]{margin:0 7% 7% !important;min-height:0 !important;overflow:auto !important}
.window .content > div[style*="aspect-ratio"]{max-width:100%;max-height:100%;min-height:0}
.taskbar{height:36px;padding:0;background:transparent;overflow:hidden;isolation:isolate}
.taskbar::before{content:"";position:absolute;z-index:-1;pointer-events:none;left:-.63%;top:-387.5%;width:101.27%;height:937.5%;background:url("https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/PROPS/PROPS_0030_BARRE.png") center/100% 100% no-repeat}
.taskbar .start{height:100%;width:5.2%;min-width:55px;padding:0;border:0;background:transparent;color:transparent;font-size:0;cursor:pointer}
.taskbar .tasktitle{display:none}

/* Les deux boutons dessinés de la barre restent interactifs même écran éteint. */
#screen-off{display:none;position:fixed;inset:0;background:#000;z-index:9000}
body.powered-off #screen-off{display:block}
.taskbar{z-index:9001;position:fixed}
.taskbar .start{position:absolute;left:1.2%;top:0;width:4.7%;min-width:0;height:100%;z-index:2}
.taskbar .refresh-button{position:absolute;left:6.0%;top:0;width:5.7%;height:100%;border:0;padding:0;background:transparent;color:transparent;font-size:0;cursor:pointer;z-index:2}
.taskbar .start:hover,.taskbar .refresh-button:hover{background:#ffffff25}

/* Contenu interactif au-dessus du dessin de fenêtre, sans fond opaque */
.window .content{z-index:5;background:transparent!important}
.window .content[style]{background:transparent!important}
.window .titlebar{z-index:6}
.window .close{z-index:7}
</style></head><body>
<main class="desktop" id="desktop"></main>
<section class="window hidden" id="window" aria-label="Fenêtre du musée"><div class="titlebar" id="titlebar"><span id="windowtitle">Musée numérique</span><button class="close" id="close" aria-label="Fermer">✕</button></div><div class="content" id="content"></div></section>
<div id="screen-off" aria-hidden="true"></div><footer class="taskbar"><button class="start" id="start" title="Éteindre / rallumer l’écran" aria-label="Éteindre ou rallumer l’écran">Éteindre</button><button class="refresh-button" id="refresh-button" title="Actualiser la page (F5)" aria-label="Actualiser la page">F5</button><span class="tasktitle">JEAN MARTIN OSSEUX — V1 en construction</span></footer>
<script>
const sections=[["Illustrations","🖼️","01_ILLUS"],["Films","📺","02_FILMS"],["Musiques","💿","03_MUSIQUES"],["BD","📖","04_BD"],["Photos","📷","05_PHOTO"],["Liens","🌳","06_LIENS"],["Pro","🗂️","07_PRO"],["Textes","📝","08_TEXTE"],["Carnets","✏️","09_CARNETS_DE_CROQUIS"],["Zinzine Online","🐸","10_ZINZINE_ONLINE"]];
const desktop=document.querySelector("#desktop"),win=document.querySelector("#window"),content=document.querySelector("#content");
for(const [name,emoji,id] of sections){const b=document.createElement("button");b.className="shortcut";b.innerHTML='<span class="emoji">'+emoji+'</span>'+name;b.onclick=()=>{if(id==="01_ILLUS"){window.location.href="./illustrations.html"}else if(id==="03_MUSIQUES"){window.location.href="./musiques.html"}else if(id==="02_FILMS"){window.location.href="./cinema.html"}else if(id==="05_PHOTO"){window.location.href="./photos.html"}else if(id==="04_BD"){window.location.href="./bd.html"}else if(id==="08_TEXTE"){window.location.href="./textes.html"}else if(id==="10_ZINZINE_ONLINE"){openZinzine()}else if(id==="06_LIENS"){openLinks()}else{openSection(name,id)}};desktop.append(b)}
const artworks=["allin.jpg","bagarre  tout.jpg","bagarre all.jpg","BLEDcolo.jpg","casino.jpg","ecran.jpg","enfant seul.jpg","fegeff.png","illu insta.jpg","illuinsta.jpg","INSTA1.jpg","INSTA2.jpg","INSTA6.jpg","MAGICUS AND GUN1.jpg","MRSTEAKGREBIK.png","MRSTEAKGREBIK2.png","portrait alt.jpg","portugall.jpg","pose.jpg","RATNORM.jpg","sketch.jpg","tapisserie post insta.jpg","truc cool boutique.jpg"];
let galleryIndex=0;
function showGallery(){
 content.replaceChildren();
 const heading=document.createElement("h1");heading.textContent="Musée des illustrations";
 const room=document.createElement("div");room.className="gallery";
 const info=document.createElement("p");info.className="gallery-help";info.textContent="Clique sur un cadre pour faire défiler les œuvres.";
 const controls=document.createElement("div");controls.className="gallery-controls";
 const prev=document.createElement("button");prev.textContent="← Précédent";
 const count=document.createElement("span");count.className="gallery-caption";
 const next=document.createElement("button");next.textContent="Suivant →";
 const draw=()=>{room.replaceChildren();for(let k=0;k<3;k++){const idx=(galleryIndex+k)%artworks.length;const b=document.createElement("button");b.className="art";b.title="Changer cette œuvre";const pic=document.createElement("img");pic.className="work";pic.alt=artworks[idx];pic.src="./assets/illustrations/ILLUS/"+encodeURIComponent(artworks[idx]);const frame=document.createElement("img");frame.className="frame";frame.alt="";frame.src="./assets/illustrations/CADRE"+(k+1)+".png";b.append(pic,frame);b.onclick=()=>{galleryIndex=(galleryIndex+1)%artworks.length;draw()};room.append(b)}count.textContent=(galleryIndex+1)+" / "+artworks.length};
 prev.onclick=()=>{galleryIndex=(galleryIndex-1+artworks.length)%artworks.length;draw()};
 next.onclick=()=>{galleryIndex=(galleryIndex+1)%artworks.length;draw()};
 controls.append(prev,count,next);content.append(heading,room,controls,info);draw();
}
function openLinks(){
 document.querySelector("#windowtitle").textContent="Liens — Arbre des connexions";
 content.replaceChildren();content.style.cssText="padding:0;overflow:hidden;flex:1;background:transparent;display:flex;align-items:center;justify-content:center";
 win.style.width="min(1120px,94vw)";win.style.height="min(740px,88vh)";win.style.left="max(0px,calc(50% - min(560px,47vw)))";win.style.top="5%";
 const stage=document.createElement("div");stage.style.cssText="position:relative;width:100%;max-width:1100px;aspect-ratio:16/9;flex-shrink:0;background:transparent";
 const tree=document.createElement("img");tree.src="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/liens/LIENSARBRE.png";tree.alt="Arbre des liens";tree.style.cssText="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;mix-blend-mode:screen";stage.append(tree);
 const links=[
 ["SoundCloud DJ JeanMa","https://soundcloud.com/djjeanma-75865563",34,38],
 ["SoundCloud PDM","https://soundcloud.com/prisonniers-du-micro",42,27],
 ["YouTube Grebik","https://www.youtube.com/@grebik_jmo_prod",53,21],
 ["YouTube PDM","https://www.youtube.com/@PrisonniersduMicro",62,28],
 ["Spotify DJ JeanMa","https://open.spotify.com/artist/1ewcTedZYHOdOnjtPXDIC6?si=NO1I2343RNuvSbZsRHv6eg",68,40],
 ["Instagram Grebik","https://www.instagram.com/grebikovitch/",36,53],
 ["Instagram PDM","https://www.instagram.com/prisonniers_du_micro/",46,43],
 ["Instagram On se déréalise","https://www.instagram.com/onsederealise/",60,48],
 ["Zinzine Online","https://fanzinzine.neocities.org/",53,35]
 ];
 for(const [name,url,x,y] of links){const a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener noreferrer";a.title=name;a.style.cssText="position:absolute;left:"+x+"%;top:"+y+"%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:#fff;font:clamp(9px,1.05vw,13px) Tahoma,sans-serif;text-shadow:0 2px 4px #000,0 0 4px #000;z-index:2;max-width:16%;text-align:center";const fruit=document.createElement("span");fruit.textContent="🍒";fruit.style.cssText="font-size:clamp(22px,3.2vw,39px);filter:drop-shadow(1px 3px 2px #0009);transition:transform .15s";const label=document.createElement("span");label.textContent=name;label.style.cssText="background:#07151bc9;border:1px solid #a6ebdf88;border-radius:5px;padding:3px 5px;line-height:1.2";a.addEventListener("mouseenter",()=>fruit.style.transform="scale(1.25)");a.addEventListener("mouseleave",()=>fruit.style.transform="");a.append(fruit,label);stage.append(a)}
 content.append(stage);win.classList.remove("hidden");
}
function openZinzine(){document.querySelector("#windowtitle").textContent="Zinzine Online";content.replaceChildren();content.style.background="#fff";content.style.display="flex";content.style.alignItems="center";content.style.justifyContent="center";const link=document.createElement("a");link.href="https://fanzinzine.neocities.org/";link.target="_blank";link.rel="noopener noreferrer";link.title="Ouvrir Zinzine Online";const img=document.createElement("img");img.src="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/zinzine/IMG.png";img.alt="Zinzine Online";img.style.cssText="display:block;width:min(100%,500px);height:auto;cursor:pointer";link.append(img);content.append(link);win.style.width="min(620px,85vw)";win.style.height="min(390px,65vh)";win.style.left="max(0px,calc(50% - 310px))";win.style.top="15%";win.classList.remove("hidden")}
function openSection(name,id){content.style.cssText="";content.style.background="";content.style.display="";content.style.alignItems="";content.style.justifyContent="";document.querySelector("#windowtitle").textContent=name;content.replaceChildren();const h=document.createElement("h1");h.textContent=name;const p=document.createElement("div");p.className="notice";p.textContent="Section "+id+" — structure interactive initiale. Les décors, assets et liens du ZIP seront intégrés dans la prochaine étape.";content.append(h,p);win.classList.remove("hidden")}
document.querySelector("#close").onclick=()=>win.classList.add("hidden");
document.querySelector("#start").onclick=()=>{const off=document.body.classList.toggle("powered-off");document.querySelector("#screen-off").setAttribute("aria-hidden",String(!off));};
document.querySelector("#refresh-button").onclick=()=>window.location.reload();
let drag=false,dx=0,dy=0;const bar=document.querySelector("#titlebar");bar.addEventListener("pointerdown",e=>{if(e.target.closest("button"))return;drag=true;dx=e.clientX-win.offsetLeft;dy=e.clientY-win.offsetTop;bar.setPointerCapture(e.pointerId)});bar.addEventListener("pointermove",e=>{if(!drag)return;win.style.left=Math.max(0,Math.min(innerWidth-win.offsetWidth,e.clientX-dx))+"px";win.style.top=Math.max(0,Math.min(innerHeight-win.offsetHeight-36,e.clientY-dy))+"px"});bar.addEventListener("pointerup",()=>drag=false);
</script></body></html>
