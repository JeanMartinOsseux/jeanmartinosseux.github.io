html,body{height:100%;overflow:hidden}body{min-height:0}main{height:100dvh;max-width:1100px;padding:1vh 22px 1vh;display:flex;flex-direction:column;align-items:center;gap:0;overflow:hidden}.temporary-title{height:clamp(90px,15vh,160px);flex:0 0 auto;margin:0 0 .5vh;width:100%}.temporary-title img{max-width:100%;height:100%;object-fit:contain;transform:scale(1.35)}.compose{flex:0 0 auto;width:min(100%,1040px);margin:0;height:clamp(240px,37vh,400px);min-height:0!important}.compose input#pseudo{left:12%;top:11%;width:44%;height:17%;font-size:clamp(16px,2.2vh,24px)}.compose textarea#message{left:11%;top:32%;width:80%;height:39%;font-size:clamp(16px,2.2vh,24px)}.compose button.send{left:10%;top:76%;width:25%;height:17%;z-index:10}.compose .hint{bottom:-15px;font-size:clamp(10px,1.4vh,13px)}.compose .status{bottom:-32px;font-size:12px}.visitors-title{flex:0 0 auto;margin:clamp(22px,3vh,38px) 0 0;font-size:clamp(17px,2.7vh,28px)}#messages{width:100%;flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:0}#messages .comment{width:min(100%,1050px);margin:0;height:auto;min-height:0!important;flex:1 1 0;background-size:100% 100%}#messages .comment-inner{left:28%;top:20%;width:55%;height:67%;padding:4px 10px}#messages .comment-inner h3{font-size:clamp(14px,2.3vh,22px)}#messages .comment-inner p{font-size:clamp(12px,1.9vh,18px)}.pager{flex:0 0 auto;margin:0;min-height:clamp(45px,7vh,70px)}.arrow{height:clamp(40px,6vh,65px)}.page-number{height:clamp(40px,6vh,60px)}.back{top:8px;left:8px}@media(max-height:700px){.temporary-title{height:12vh}.compose{height:34vh}.visitors-title{margin-top:20px}.pager{min-height:40px}}@media(max-width:650px){main{padding:2vh 8px 1vh}.temporary-title img{transform:scale(1.2)}.compose{height:32vh}.comment-inner{padding:2px!important}#messages .comment-inner{left:28%;width:56%;top:18%;height:70%}.visitors-title{margin-top:30px}.back{width:85px;height:40px}}
</style></head><body><a class="back" href="./index.html" aria-label="Retour au bureau" title="Bureau"></a><main><h1 class="temporary-title"><img src="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/props_new/LIVREOR_LOGO.png" alt="Livre d’or"></h1><section class="illustrated compose" aria-label="Laisser un commentaire"><form id="form"><label for="pseudo">Ton pseudo</label><input id="pseudo" name="pseudo" maxlength="32" minlength="2" required autocomplete="nickname"><label for="message">Ton message</label><textarea id="message" name="message" maxlength="500" minlength="2" required></textarea><input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true"><button class="send" type="submit">Publier</button></form><p class="hint" id="remaining">3 messages maximum par visiteur · 500 caractères maximum</p><p class="status" id="status" role="status" aria-live="polite"></p></section><h2 class="visitors-title">Les messages des visiteurs</h2><section id="messages" aria-live="polite"><p style="text-align:center">Chargement des messages…</p></section><nav class="pager" aria-label="Pages des commentaires"><button class="arrow prev" id="prev" aria-label="Page précédente"></button><span class="page-number" id="page-label" aria-label="Page 1 sur 1"></span><button class="arrow next" id="next" aria-label="Page suivante"></button></nav></main><script>
const $=id=>document.getElementById(id);const propDigits="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/PROPS/";let current=1;
async function load(page=1){try{const r=await fetch("/api/livre-or?page="+page,{cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.error||"Erreur de chargement");current=d.page;$("messages").replaceChildren();if(!d.messages.length){const p=document.createElement("p");p.textContent="Pas encore de commentaire. Sois le premier !";p.style.textAlign="center";$("messages").append(p)}for(const m of d.messages){const box=document.createElement("article");box.className="illustrated comment";const inner=document.createElement("div");inner.className="comment-inner";const h=document.createElement("h3");h.textContent=m.pseudo;const t=document.createElement("time");t.textContent=m.date_creation?new Date(m.date_creation.replace(" ","T")+"Z").toLocaleDateString("fr-FR"):"";const p=document.createElement("p");p.textContent=m.message;inner.append(h,t,p);box.append(inner);$("messages").append(box)}const pageLabel=$("page-label");pageLabel.replaceChildren();pageLabel.setAttribute("aria-label","Page "+d.page+" sur "+d.pages);const num=document.createElement("img");num.alt="Page "+d.page;num.className="black-number";num.src=propDigits+(d.page<=25?"PROPS_"+String(74-d.page).padStart(4,"0")+"_"+d.page+".png":"PROPS_0073_1.png");pageLabel.append(num);$("prev").disabled=d.page<=1;$("next").disabled=d.page>=d.pages;if(d.remaining!==null){$("remaining").textContent=d.remaining+" message(s) restant(s) sur 3 · 500 caractères maximum";$("form").querySelector("button").disabled=d.remaining===0}}catch(e){$("messages").textContent=e.message;$("page-label").textContent="Indisponible";$("prev").disabled=$("next").disabled=true}}
$("prev").onclick=()=>load(current-1);$("next").onclick=()=>load(current+1);
$("form").onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,btn=form.querySelector("button"),status=$("status");btn.disabled=true;status.textContent="Publication…";try{const r=await fetch("/api/livre-or",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({pseudo:$("pseudo").value,message:$("message").value,website:form.elements.website.value})});const d=await r.json();if(!r.ok)throw Error(d.error||"Erreur de publication");form.reset();status.textContent="Ton commentaire est publié !";await load(1)}catch(e){status.textContent=e.message}finally{if(!$("remaining").textContent.startsWith("0 message"))btn.disabled=false}};
load();
</script></body></html>
