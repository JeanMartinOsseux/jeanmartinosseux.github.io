<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Livre d'or — Musée numérique</title>
<style>
@font-face{font-family:JMH;src:url("https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/font/JMH%20Typewriter.ttf")}@font-face{font-family:JMH;src:url("https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/font/JMH%20Typewriter-Bold.ttf");font-weight:700}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{font-family:JMH,monospace;color:#1d1725;background:#e8e7e0 url("https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/props_new/livre_or_fond.png") center/cover no-repeat}
button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.35;cursor:default}
#scene{position:relative;width:100%;height:100dvh;overflow:hidden}
.back{position:absolute;z-index:4;left:2%;top:1.5%;width:15%;height:11%;background:url("https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/PROPS/PROPS_0077_BUREAU.png") center/contain no-repeat}
.logo{position:absolute;left:8%;top:0%;width:84%;height:39%;object-fit:contain;transform:scale(1.3);transform-origin:center top;cursor:pointer}
.compose{position:absolute;left:22%;top:20%;width:56%;height:50%;background:url("https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/props_new/livre_or_fenetre_laisser_commentaire.png") center/100% 100% no-repeat}
.compose form{position:absolute;inset:0;margin:0}
.field{position:absolute;background:transparent;border:0;border-radius:4px;color:#21162b;outline-offset:1px}
#pseudo{left:20%;top:23%;width:29%;height:10%;padding:0 8px;font-size:clamp(14px,1.4vw,22px)}
#message{left:13%;top:36%;width:76%;height:23%;padding:8px 10px;resize:none;font-size:clamp(14px,1.4vw,22px)}
.send{position:absolute;left:11%;top:62%;width:19%;height:10%;padding:0;border:0;background:transparent;color:transparent;font-size:0;z-index:2}
.send:hover{background:#ffffff22}.send:focus-visible,.field:focus-visible{outline:2px solid #304b92}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.honeypot{position:absolute;left:-10000px;width:1px;height:1px}
.feedback{position:absolute;left:20%;right:20%;top:59%;text-align:center;font-size:clamp(10px,1vw,14px);line-height:1.15}
#status{color:#8c1820;font-weight:700;min-height:1em}
#messages{position:absolute;left:10%;right:10%;top:60%;height:20%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10%;align-items:center}
.comment{position:relative;width:100%;height:100%;min-width:0;background:url("https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/props_new/livre_or_fenetre_commentaire_de_quelqun.png") 48% 53%/240.6% 279.8% no-repeat}
.comment-inner{position:absolute;inset:9% 9% 9%;overflow:auto;overflow-wrap:anywhere;padding:2px 6px}
.comment h3{font-size:clamp(13px,1.25vw,19px);margin:0 0 2px;line-height:1.1}
.comment time{display:inline;font-size:clamp(10px,.9vw,13px);line-height:1.15;margin-left:12px}.comment h3{display:inline}
.comment-heading{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.comment-heading time{margin-left:0}.comment p{font-size:clamp(12px,1.05vw,16px);line-height:1.2;white-space:pre-wrap;margin:6px 0 0}
.empty{grid-column:1/-1;text-align:center}
.pager{position:absolute;bottom:0.5%;left:0;width:100%;height:8%;display:flex;align-items:center;justify-content:center;gap:12px}
.arrow{width:clamp(75px,9vw,155px);height:100%;border:0;background:transparent center/contain no-repeat}
.prev{background-image:url("https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/PROPS/PROPS_0076_PRECEDANT.png")}.next{background-image:url("https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/PROPS/PROPS_0075_SUIVANT.png")}
.page-number{display:flex;align-items:center;justify-content:center;gap:7px;min-width:75px;height:100%}
.page-number img{display:block;height:60%;max-width:50px;object-fit:contain;filter:brightness(0)}
.page-number span{font-size:clamp(18px,2.2vw,28px)}
@media(max-width:700px){.back{left:1%;top:1%;width:20%;height:8%}.logo{left:20%;width:60%;top:3%;height:19%}.compose{left:4%;width:92%;top:25%;height:31%}#messages{left:3%;right:3%;gap:2%;top:65%;height:18%}.comment-inner{inset:6% 5% 7%;padding:0 2px}.comment h3{font-size:11px}.comment time{font-size:9px}.comment p{font-size:10px}.feedback{left:5%;right:5%;top:59%}.pager{bottom:4%}}
@media(max-height:600px){.logo{height:21%}.compose{top:23%;height:33%}.feedback{top:59%}#messages{top:64%;height:21%}.pager{bottom:1%}}
</style></head><body>
<main id="scene">
<a class="back" href="./index.html" aria-label="Retour au bureau" title="Bureau"></a>
<img class="logo" src="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/props_new/LIVREOR_LOGO.png" alt="Livre d'or">
<section class="compose" aria-label="Laisser un commentaire">
<form id="form"><label class="visually-hidden" for="pseudo">Ton pseudo</label><input class="field" id="pseudo" name="pseudo" maxlength="32" minlength="2" required autocomplete="nickname" placeholder="">
<label class="visually-hidden" for="message">Ton commentaire</label><textarea class="field" id="message" name="message" maxlength="500" minlength="2" required></textarea>
<input class="honeypot" name="website" tabindex="-1" autocomplete="off" aria-hidden="true"><button class="send" type="submit" aria-label="Publier le commentaire">Publier</button></form>
</section>
<div class="feedback"><div id="remaining">3 messages maximum par visiteur · 500 caractères maximum</div><div id="status" role="status" aria-live="polite"></div></div>
<section id="messages" aria-label="Commentaires des visiteurs" aria-live="polite"><p class="empty">Chargement des messages…</p></section>
<nav class="pager" aria-label="Pages des commentaires"><button class="arrow prev" id="prev" aria-label="Page précédente"></button><span class="page-number" id="page-label" aria-label="Page 1 sur 1"></span><button class="arrow next" id="next" aria-label="Page suivante"></button></nav>
</main>
<script>
const $=id=>document.getElementById(id);
const propDigits="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/PROPS/";
let current=1,adminMode=false,logoClicks=0,logoClickTime=0;
document.querySelector(".logo").addEventListener("click",async()=>{
 const now=Date.now();logoClicks=now-logoClickTime<2500?logoClicks+1:1;logoClickTime=now;
 if(logoClicks<5)return;logoClicks=0;
 if(adminMode){
  if(!confirm("Déconnecter le mode administrateur ?"))return;
  await fetch("/api/livre-or-admin",{method:"DELETE"});adminMode=false;await load(current);return;
 }
 const password=prompt("Accès administrateur — mot de passe :");
 if(password===null||!password)return;
 try{
  const response=await fetch("/api/livre-or-admin",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password})});
  const data=await response.json();if(!response.ok)throw Error(data.error||"Connexion impossible");
  await load(current);alert("Mode administrateur activé !");
 }catch(e){alert(e.message)}
});
function digit(n){const img=document.createElement("img");img.alt=String(n);img.src=propDigits+(n>=1&&n<=25?"PROPS_"+String(74-n).padStart(4,"0")+"_"+n+".png":"PROPS_0073_1.png");return img}
function showPage(n,pages){const el=$("page-label");el.replaceChildren(digit(n));const slash=document.createElement("span");slash.textContent="/";el.append(slash,digit(pages));el.setAttribute("aria-label","Page "+n+" sur "+pages)}
async function load(page=1){
 try{
 const response=await fetch("/api/livre-or?page="+page,{cache:"no-store"}),data=await response.json();
 if(!response.ok)throw Error(data.error||"Erreur de chargement");
 current=data.page;adminMode=Boolean(data.admin);$("messages").replaceChildren();
 if(!data.messages.length){const empty=document.createElement("p");empty.className="empty";empty.textContent="Pas encore de commentaire. Sois le premier !";$("messages").append(empty)}
 for(const m of data.messages){
 const card=document.createElement("article");card.className="comment";
 const inner=document.createElement("div");inner.className="comment-inner";
 const name=document.createElement("h3");name.textContent=m.pseudo;
 const date=document.createElement("time");date.textContent=m.date_creation?new Date(m.date_creation.replace(" ","T")+"Z").toLocaleDateString("fr-FR"):"";
 const message=document.createElement("p");message.textContent=m.message;
 const heading=document.createElement("div");heading.className="comment-heading";heading.append(name,date);inner.append(heading,message);card.append(inner);$("messages").append(card);
 }
 showPage(data.page,data.pages);
 $("prev").disabled=data.page<=1;$("next").disabled=data.page>=data.pages;
 if(adminMode){$("remaining").textContent="Mode administrateur · publications illimitées";$("form").querySelector(".send").disabled=false}
 else if(data.remaining!==null){$("remaining").textContent=data.remaining+" message(s) restant(s) sur 3 · 500 caractères maximum";$("form").querySelector(".send").disabled=data.remaining===0}
 }catch(err){$("messages").replaceChildren();const p=document.createElement("p");p.className="empty";p.textContent=err.message;$("messages").append(p);$("prev").disabled=$("next").disabled=true}
}
$("prev").onclick=()=>load(current-1);$("next").onclick=()=>load(current+1);
$("form").onsubmit=async event=>{
 event.preventDefault();const form=event.currentTarget,button=form.querySelector(".send"),status=$("status");
 button.disabled=true;status.textContent="Publication…";
 try{
 const response=await fetch("/api/livre-or",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({pseudo:$("pseudo").value,message:$("message").value,website:form.elements.website.value})});
 const data=await response.json();if(!response.ok)throw Error(data.error||"Erreur de publication");
 form.reset();status.textContent="Ton commentaire est publié !";await load(1);
 }catch(err){status.textContent=err.message}
 finally{if(!$("remaining").textContent.startsWith("0 message"))button.disabled=false}
};
load();
</script></body></html>
