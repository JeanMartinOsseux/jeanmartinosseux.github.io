<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Livre d'or — Musée numérique</title><style>
:root{font-family:Tahoma,Verdana,sans-serif;color:#201a18}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#d9c9ad url("https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/props_new/livre_or_fond.png") center top/cover fixed no-repeat}.back{position:fixed;top:15px;left:18px;z-index:5;width:140px;height:65px;background:url("https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/PROPS/PROPS_0077_BUREAU.png") center/contain no-repeat;filter:drop-shadow(2px 3px 2px #0005)}main{max-width:850px;margin:0 auto;padding:65px 24px 90px}h1{text-align:center;font-size:clamp(30px,5vw,52px);margin:5px 0 24px;text-shadow:2px 2px #fff9}.illustrated{position:relative;width:100%;min-height:350px;background-position:center;background-size:100% 100%;background-repeat:no-repeat;padding:clamp(35px,8%,70px) clamp(50px,11%,100px)}.compose{background-image:url("https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/props_new/livre_or_fenetre_laisser_commentaire.png")}.comment{background-image:url("https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/props_new/livre_or_fenetre_commentaire_de_quelqun.png");min-height:245px;margin:15px 0;overflow-wrap:anywhere}form{display:grid;gap:10px;max-width:520px;margin:auto}label{font-weight:bold;font-size:14px}input,textarea{width:100%;border:2px solid #6d5e4c;background:#fffdf0e8;border-radius:4px;font:16px Tahoma,sans-serif;padding:9px}textarea{min-height:95px;resize:vertical}button{cursor:pointer;font:700 16px Tahoma,sans-serif}button.send{justify-self:end;padding:10px 24px;border:2px solid #473d31;border-radius:5px;background:#fff2c9}.hint,.status{text-align:center;font-size:13px;margin:6px 0}.status{min-height:20px;font-weight:bold}h2{text-align:center;margin:35px 0 15px}.comment h3{margin:10px 0;font-size:21px}.comment time{font-size:12px;opacity:.7}.comment p{white-space:pre-wrap;line-height:1.45}.pager{display:flex;align-items:center;justify-content:center;gap:25px;margin:24px 0}.arrow{width:105px;height:65px;background:transparent center/contain no-repeat;border:0}.prev{background-image:url("https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/PROPS/PROPS_0076_PRECEDANT.png")}.next{background-image:url("https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/PROPS/PROPS_0075_SUIVANT.png")}button:disabled{opacity:.35;cursor:default}.hp{position:absolute;left:-9999px}a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #2860b8}@media(max-width:600px){main{padding:90px 10px 45px}.illustrated{padding:40px 11%;min-height:310px}.comment{min-height:220px}.back{width:110px;top:8px;left:8px}h1{font-size:30px}}
@font-face{font-family:JMH;src:url("https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/font/JMH%20Typewriter.ttf")}@font-face{font-family:JMH;src:url("https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/font/JMH%20Typewriter-Bold.ttf");font-weight:700}body,input,textarea,button{font-family:JMH,monospace!important}.temporary-title,.visitors-title{font-family:JMH,monospace}.compose{padding:0!important;min-height:350px}.compose form{position:absolute;inset:0;display:block;max-width:none;margin:0}.compose label{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.compose input#pseudo,.compose textarea#message{position:absolute;left:12%;width:75%;background:transparent!important;border:0!important;box-shadow:none!important;outline-offset:2px;color:#211a28;font-size:20px;padding:5px 12px}.compose input#pseudo{top:23%;height:15%}.compose textarea#message{top:43%;height:31%;min-height:0;resize:none}.compose button.send{position:absolute;left:11%;bottom:12%;width:25%;height:13%;padding:0;background:transparent;border:0;font-size:0;color:transparent}.compose button.send:focus-visible{outline:2px solid #235ec2}.compose .hint{position:absolute;left:5%;right:5%;bottom:-27px;margin:0;font-size:13px}.compose .status{position:absolute;left:5%;right:5%;bottom:-52px;margin:0}.visitors-title{margin-top:85px}.comment{padding:0!important;min-height:245px;position:relative}.comment-inner{position:absolute;left:32%;top:29%;width:47%;height:47%;overflow-y:auto;overflow-wrap:anywhere;padding:5px 12px;font-size:16px}.comment-inner h3{font-size:19px;margin:0 0 2px}.comment-inner time{font-size:11px}.comment-inner p{font-size:15px;margin:6px 0;line-height:1.25}.page-number{display:inline-flex;align-items:center;justify-content:center;min-width:60px;height:60px}.page-number img{display:block;max-width:85px;max-height:60px;object-fit:contain}@media(max-width:600px){.compose{min-height:290px}.compose input#pseudo,.compose textarea#message{font-size:15px}.comment{min-height:205px}.comment-inner{font-size:13px;padding:2px 4px}.comment-inner h3{font-size:15px}.comment-inner p{font-size:12px}.visitors-title{margin-top:90px}}</style></head><body><a class="back" href="./index.html" aria-label="Retour au bureau" title="Bureau"></a><main><h1 class="temporary-title">Livre d'or</h1><section class="illustrated compose" aria-label="Laisser un commentaire"><form id="form"><label for="pseudo">Ton pseudo</label><input id="pseudo" name="pseudo" maxlength="32" minlength="2" required autocomplete="nickname"><label for="message">Ton message</label><textarea id="message" name="message" maxlength="500" minlength="2" required></textarea><input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true"><button class="send" type="submit">Publier</button></form><p class="hint" id="remaining">3 messages maximum par visiteur · 500 caractères maximum</p><p class="status" id="status" role="status" aria-live="polite"></p></section><h2 class="visitors-title">Les messages des visiteurs</h2><section id="messages" aria-live="polite"><p style="text-align:center">Chargement des messages…</p></section><nav class="pager" aria-label="Pages des commentaires"><button class="arrow prev" id="prev" aria-label="Page précédente"></button><span class="page-number" id="page-label" aria-label="Page 1 sur 1"></span><button class="arrow next" id="next" aria-label="Page suivante"></button></nav></main><script>
const $=id=>document.getElementById(id);const propDigits="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/PROPS/";let current=1;
async function load(page=1){try{const r=await fetch("/api/livre-or?page="+page,{cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.error||"Erreur de chargement");current=d.page;$("messages").replaceChildren();if(!d.messages.length){const p=document.createElement("p");p.textContent="Pas encore de commentaire. Sois le premier !";p.style.textAlign="center";$("messages").append(p)}for(const m of d.messages){const box=document.createElement("article");box.className="illustrated comment";const inner=document.createElement("div");inner.className="comment-inner";const h=document.createElement("h3");h.textContent=m.pseudo;const t=document.createElement("time");t.textContent=m.date_creation?new Date(m.date_creation.replace(" ","T")+"Z").toLocaleDateString("fr-FR"):"";const p=document.createElement("p");p.textContent=m.message;inner.append(h,t,p);box.append(inner);$("messages").append(box)}const pageLabel=$("page-label");pageLabel.replaceChildren();pageLabel.setAttribute("aria-label","Page "+d.page+" sur "+d.pages);const num=document.createElement("img");num.alt="Page "+d.page;num.src=propDigits+(d.page<=25?"PROPS_"+String(74-d.page).padStart(4,"0")+"_"+d.page+".png":"PROPS_0073_1.png");pageLabel.append(num);$("prev").disabled=d.page<=1;$("next").disabled=d.page>=d.pages;if(d.remaining!==null){$("remaining").textContent=d.remaining+" message(s) restant(s) sur 3 · 500 caractères maximum";$("form").querySelector("button").disabled=d.remaining===0}}catch(e){$("messages").textContent=e.message;$("page-label").textContent="Indisponible";$("prev").disabled=$("next").disabled=true}}
$("prev").onclick=()=>load(current-1);$("next").onclick=()=>load(current+1);
$("form").onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,btn=form.querySelector("button"),status=$("status");btn.disabled=true;status.textContent="Publication…";try{const r=await fetch("/api/livre-or",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({pseudo:$("pseudo").value,message:$("message").value,website:form.elements.website.value})});const d=await r.json();if(!r.ok)throw Error(d.error||"Erreur de publication");form.reset();status.textContent="Ton commentaire est publié !";await load(1)}catch(e){status.textContent=e.message}finally{if(!$("remaining").textContent.startsWith("0 message"))btn.disabled=false}};
load();
</script></body></html>
