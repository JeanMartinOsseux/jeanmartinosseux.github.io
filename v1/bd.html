<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BD — Musée numérique</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Tahoma,Verdana,sans-serif;color:white;background:#141414 url('https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/BD/BD_FOND.png') center/cover no-repeat}.back{position:fixed;top:12px;left:12px;z-index:20;padding:9px 12px;background:#ece9d8;color:#111;text-decoration:none;border:2px outset white}.choice{position:fixed;inset:0;display:block;background:url('https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/BD/BDCHOIX.png') center/100% 100% no-repeat}.choice-hotspots{position:absolute;inset:0;pointer-events:none}.choice-hotspots button{position:absolute;top:0;height:100%;pointer-events:auto;cursor:pointer;opacity:0;background:transparent;border:0;display:block}.choice-hotspots button:focus-visible{opacity:1;outline:3px solid #ff59b7}.choice-actions{position:absolute;bottom:1%;right:1%;display:flex;gap:12px;opacity:0;pointer-events:none}.choice-actions button,.toolbar button{cursor:pointer;padding:9px 14px;background:#ece9d8;border:2px outset white;color:#111;font-family:inherit}.reader{display:none;position:fixed;inset:0;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:url('https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/BD/BD_FOND.png') center/cover no-repeat}.book{position:relative;width:min(91vw,1350px);height:min(79vh,850px);perspective:1500px;display:flex;align-items:center;justify-content:center}.book-decoration{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;opacity:1;z-index:0;transform:scale(1.72,1.55)}.page-spread{position:absolute;left:18.7%;top:3.5%;width:62.6%;height:91%;display:flex;z-index:1;gap:0;min-width:0;min-height:0;overflow:visible;isolation:auto}.page:first-child{clip-path:none;transform:none}.page:nth-child(2){clip-path:none;transform:none}.page{position:relative;flex:0 0 50%;width:50%;min-width:0;max-width:50%;height:100%;background:transparent;border:0;box-shadow:none;overflow:visible;opacity:1}.page img,.page canvas{position:absolute;inset:0;width:100%!important;height:100%!important;max-width:100%!important;max-height:100%!important;min-width:0;min-height:0;object-fit:fill;mix-blend-mode:multiply;opacity:.96}.page canvas{display:none}.page canvas{inset:0!important;width:100%!important;height:100%!important}.reader:not(.book-eight) .page-spread{left:19.1%;top:4.2%;width:61.8%;height:87.5%}.reader.book-one .page canvas{opacity:.98}.reader.book-eight .page-spread{left:22.5%;top:9%;width:55%;height:80%}.reader.book-eight .page canvas{inset:0!important;width:100%!important;height:100%!important}.page-turn{display:none!important}.page-turn.active{display:block;animation:flip .52s ease-in-out forwards}.page-turn img{width:100%;height:100%;object-fit:contain;background:white;backface-visibility:hidden}@keyframes flip{from{transform:rotateY(0deg)}to{transform:rotateY(-180deg)}}.toolbar{display:flex;align-items:center;justify-content:center;gap:12px;background:#0009;padding:8px;border-radius:6px}.toolbar span{min-width:105px;text-align:center}.pdfs{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:url('https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/BD/BD_FOND.png') center/cover no-repeat}.pdf-grid{display:grid;grid-template-columns:repeat(4,minmax(90px,1fr));gap:14px;max-width:80vw}.pdf-grid a{display:block;padding:24px 16px;background:#ece9d8;color:#111;text-align:center;border:3px outset white;text-decoration:none}.pdfs button{padding:9px 14px}.help{font-size:12px;background:#0009;padding:5px 9px}@media(max-width:700px){.page-spread{left:18.7%;top:3.5%;width:62.6%;height:91%}.book{height:68vh}.pdf-grid{grid-template-columns:repeat(2,minmax(90px,1fr))}}
.page-spread{left:8%;top:3%;width:84%;height:94%;display:block;overflow:hidden;isolation:isolate}
.page-spread>img{position:absolute;display:block;height:100%;object-fit:fill;mix-blend-mode:multiply;opacity:1}
#newSpread{left:0;top:0;width:100%}
#eightLeft{left:0;top:0;width:50%}
#eightRight{left:50%;top:0;width:50%}
.reader:not(.book-eight) .page-spread,.reader.book-eight .page-spread{left:8%;top:3%;width:84%;height:94%}
.page-spread,.reader:not(.book-eight) .page-spread{left:0!important;top:0!important;width:100%!important;height:100%!important;overflow:visible!important;isolation:isolate!important}
#newSpread{position:absolute;inset:0;width:100%!important;height:100%!important;object-fit:fill;mix-blend-mode:multiply;opacity:1;transform:none!important;clip-path:none!important}
#eightLeft,#eightRight{mix-blend-mode:multiply;opacity:1}
.book{isolation:auto}.page-spread,.reader:not(.book-eight) .page-spread,.reader.book-eight .page-spread{left:8%!important;top:5%!important;width:84%!important;height:89%!important;display:flex!important;overflow:visible!important;isolation:auto!important;gap:0!important;pointer-events:none}
.page-spread>img,#newSpread,#eightLeft,#eightRight{position:relative!important;left:auto!important;top:auto!important;inset:auto!important;width:50%!important;height:100%!important;flex:0 0 50%;max-width:50%!important;object-fit:contain!important;mix-blend-mode:multiply!important;opacity:1!important;transform:none!important;clip-path:none!important;background:transparent!important}
.book-decoration{transform:scale(1.72,1.55)}
</style></head><body><a class="back" href="./index.html">← Bureau</a><section class="choice" id="choice"><div class="choice-hotspots" id="hotspots" aria-label="Choisir une BD"></div><div class="choice-actions"><button id="openPdf">Choisir une BD (1 à 8)</button></div></section><section class="reader" id="reader"><div class="book"><img class="book-decoration" src="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/BD/LIVRE.png" alt=""><div class="page-spread"><div class="page" id="leftPage"><img id="left" alt="Page de gauche"><canvas id="leftCanvas"></canvas></div><div class="page" id="rightPage"><img id="right" alt="Page de droite"><canvas id="rightCanvas"></canvas></div><div class="page-turn" id="turn"><img id="turnImage" alt=""></div></div></div><div class="toolbar"><button id="prev">◀ Précédent</button><span id="count"></span><button id="next">Suivant ▶</button><button id="return">Choix</button></div><div class="help">Flèches du clavier pour tourner les pages</div></section><section class="pdfs" id="pdfs"><div class="pdf-grid" id="pdfGrid"></div><button id="pdfBack">Retour au choix</button></section><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script>
const base="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/BD/";
const sets={
  1:Array.from({length:7},(_,i)=>base+'1/1_0007s_'+String(i).padStart(4,'0')+'_1.png'),
  2:Array.from({length:7},(_,i)=>base+'2/2_0006s_'+String(i).padStart(4,'0')+'_2.png'),
  3:Array.from({length:7},(_,i)=>base+'3/3_0005s_'+String(i).padStart(4,'0')+'_3.png'),
  4:Array.from({length:7},(_,i)=>base+'4/4_0004s_'+String(i).padStart(4,'0')+'_4.png'),
  5:Array.from({length:7},(_,i)=>base+'5/5_0003s_'+String(i).padStart(4,'0')+'_5.png'),
  6:Array.from({length:7},(_,i)=>base+'6/6_0002s_'+String(i).padStart(4,'0')+'_6.png'),
  7:Array.from({length:7},(_,i)=>base+'7/7_0001s_'+String(i).padStart(4,'0')+'_7.png'),
  8:Array.from({length:24},(_,i)=>base+'BD_P_'+String(23-i).padStart(4,'0')+'_BD P'+(i+1)+'.jpg')
};
const choice=document.getElementById('choice'),reader=document.getElementById('reader'),pdfs=document.getElementById('pdfs');
const count=document.getElementById('count'),spreadLayer=document.querySelector('.page-spread');
spreadLayer.innerHTML='<img id="newSpread" alt="Double page de bande dessinée"><img id="eightLeft" alt="Page gauche"><img id="eightRight" alt="Page droite">';
const newSpread=document.getElementById('newSpread'),eightLeft=document.getElementById('eightLeft'),eightRight=document.getElementById('eightRight');
let book=1,spread=0;
function mode(name){choice.style.display=name==='choice'?'block':'none';reader.style.display=name==='reader'?'flex':'none';pdfs.style.display=name==='pdfs'?'flex':'none'}
function draw(){
 const files=sets[book],isEight=book===8,total=Math.ceil(files.length/2);
 spread=Math.max(0,Math.min(total-1,spread));
 reader.classList.toggle('book-eight',isEight);
 newSpread.style.display='none';
 eightLeft.style.display='block';
 eightRight.style.display=files[spread*2+1]?'block':'none';
 eightLeft.src=files[spread*2];
 if(files[spread*2+1])eightRight.src=files[spread*2+1];
 count.textContent=(spread*2+1)+'–'+Math.min(spread*2+2,files.length)+' / '+files.length+' · BD '+book;
}
function openBook(n){book=n;spread=0;mode('reader');draw()}
function move(dir){const max=Math.ceil(sets[book].length/2)-1;spread=Math.max(0,Math.min(max,spread+dir));draw()}
document.getElementById('openPdf').onclick=()=>mode('pdfs');
document.getElementById('return').onclick=()=>mode('choice');
document.getElementById('pdfBack').onclick=()=>mode('choice');
document.getElementById('prev').onclick=()=>move(-1);
document.getElementById('next').onclick=()=>move(1);
document.addEventListener('keydown',e=>{if(reader.style.display!=='flex')return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});
for(let i=1;i<=8;i++){
 const a=document.createElement('a');a.href='#';a.textContent='BD '+i;a.onclick=e=>{e.preventDefault();openBook(i)};document.getElementById('pdfGrid').append(a);
 const h=document.createElement('button');h.type='button';h.setAttribute('aria-label','Ouvrir BD '+i);h.title='BD '+i;h.style.left=((i-1)*12.5)+'%';h.style.width='12.5%';h.onclick=()=>openBook(i);document.getElementById('hotspots').append(h);
}
</script></body></html>
