<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BD — Musée numérique</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Tahoma,Verdana,sans-serif;color:#fff;background:#b7a064}.back{position:fixed;top:12px;left:12px;z-index:20;padding:9px 12px;background:#ece9d8;color:#111;text-decoration:none;border:2px outset white}.choice{position:fixed;inset:0;background:url('https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/BD/BDCHOIX.png') center/100% 100% no-repeat}.choice-hotspots{position:absolute;inset:0;pointer-events:none}.choice-hotspots button{position:absolute;top:0;height:100%;pointer-events:auto;cursor:pointer;opacity:0;background:transparent;border:0}.choice-hotspots button:focus-visible{opacity:1;outline:3px solid #ff59b7}.choice-actions{display:none}.reader,.pdfs{display:none;position:fixed;inset:0;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:url('https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/BD/BD_FOND.png') center/cover no-repeat}.book{position:relative;width:min(91vw,calc(77vh * 1.5));aspect-ratio:1.5/1;height:auto;flex-shrink:0}.book-decoration{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;z-index:0}.page-spread{position:absolute;left:2%;top:1.5%;width:96%;height:89%;z-index:1;pointer-events:none;mix-blend-mode:multiply}.page-spread img{position:absolute;display:block;mix-blend-mode:normal;opacity:1;background:transparent;border:0;max-width:none;transform:none;clip-path:none}.book-decoration{transform:scale(1.24,1.48);transform-origin:center center}.book-one .page-spread{left:4%;top:2.5%;width:92%;height:85%}.book{transform-origin:center center;touch-action:none}.book.zoomed{cursor:grab}.book.zoomed.dragging{cursor:grabbing}.toolbar button[aria-pressed="true"]{background:#d6e8ff;border-color:#6a91bd}.page-spread #newSpread{display:none!important}.page-spread #eightLeft{left:0;top:0;width:50%;height:100%;object-fit:fill}.page-spread #eightRight{left:50%;top:0;width:50%;height:100%;object-fit:fill}.toolbar{display:flex;align-items:center;justify-content:center;gap:12px;background:#0009;padding:8px;border-radius:6px}.toolbar button,.pdfs button{cursor:pointer;padding:9px 14px;background:#ece9d8;border:2px outset white;color:#111;font-family:inherit}.toolbar span{min-width:105px;text-align:center}.zoom-controls{display:flex;align-items:center;gap:6px;padding:3px 7px;background:#ece9d8;color:#111;border-radius:3px}.zoom-controls button{padding:5px 9px}.zoom-controls input{width:115px;accent-color:#607ea7;cursor:pointer}.zoom-controls output{min-width:43px;text-align:right;font-size:12px;font-weight:bold}@media(max-width:700px){.toolbar{gap:5px;flex-wrap:wrap}.zoom-controls input{width:85px}}.help{font-size:12px;background:#0009;padding:5px 9px}.pdf-grid{display:grid;grid-template-columns:repeat(4,minmax(90px,1fr));gap:14px;max-width:80vw}.pdf-grid a{display:block;padding:24px 16px;background:#ece9d8;color:#111;text-align:center;border:3px outset white;text-decoration:none}@media(max-width:700px){.book{width:min(96vw,calc(68vh * 1.5));height:auto}.pdf-grid{grid-template-columns:repeat(2,minmax(90px,1fr))}}
/* Props dessinés pour les contrôles BD, sans toucher au lecteur ni au zoom */
.prop-crop{position:relative;display:block;width:100%;height:100%;overflow:hidden;pointer-events:none}

.toolbar #prev:hover,.toolbar #next:hover,.toolbar #return:hover,.back:hover{filter:brightness(1.2);transform:scale(1.04)}

/* Compteur illustré et barre de zoom avec boutons superposés */
.toolbar #count{display:flex;align-items:center;justify-content:center;gap:3px;min-width:170px;white-space:nowrap}
.bd-number{width:23px;height:31px;flex:none}

/* Separateurs peints et zoom étiré dans son emplacement */
.toolbar #count .bd-separator{display:inline-block;width:8px!important;height:26px!important;min-width:0!important;flex:0 0 8px;overflow:hidden}
.zoom-controls{width:260px;min-width:260px;height:52px;min-height:52px;overflow:hidden}

/* Zoom : garder le dessin visible, supprimer la seconde piste native superposée */
.zoom-controls #zoomRange{appearance:none;-webkit-appearance:none;background:transparent!important;position:absolute;left:36%;top:25%;width:34%;height:50%;margin:0;cursor:pointer;outline-offset:2px}
.zoom-controls #zoomRange::-webkit-slider-runnable-track{height:4px;background:transparent;border:0;box-shadow:none}

</style></head><body><a class="back" href="./index.html">← Bureau</a><section class="choice" id="choice"><div class="choice-hotspots" id="hotspots" aria-label="Choisir une BD"></div><div class="choice-actions"><button id="openPdf">Choisir une BD (1 à 8)</button></div></section><section class="reader" id="reader"><div class="book"><img class="book-decoration" src="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/BD/LIVRE.png" alt=""><div class="page-spread"><div class="page" id="leftPage"><img id="left" alt="Page de gauche"><canvas id="leftCanvas"></canvas></div><div class="page" id="rightPage"><img id="right" alt="Page de droite"><canvas id="rightCanvas"></canvas></div><div class="page-turn" id="turn"><img id="turnImage" alt=""></div></div></div><div class="toolbar"><button id="prev">◀ Précédent</button><span id="count"></span><button id="next">Suivant ▶</button><div class="zoom-controls" aria-label="Réglage du zoom"><label for="zoomRange">🔍</label><button id="zoomOut" title="Dézoomer" aria-label="Dézoomer">−</button><input id="zoomRange" type="range" min="100" max="350" step="10" value="100" aria-label="Niveau de zoom"><button id="zoomIn" title="Zoomer" aria-label="Zoomer">+</button><output id="zoomValue" for="zoomRange">100 %</output><button id="resetZoom" title="Revenir immédiatement à 100 %">↩ 100 %</button></div><button id="return">Choix</button></div><div class="help">Flèches du clavier pour tourner les pages</div></section><section class="pdfs" id="pdfs"><div class="pdf-grid" id="pdfGrid"></div><button id="pdfBack">Retour au choix</button></section><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script>

const propRoot='https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/PROPS/';
function prop(file,b){const [x,y,w,h]=b;const el=document.createElement('span');el.className='prop-crop';const img=document.createElement('img');img.alt='';img.src=propRoot+file;img.style.cssText='left:'+(-x/w*100)+'%;top:'+(-y/h*100)+'%;width:'+(1920/w*100)+'%;height:'+(1080/h*100)+'%';el.append(img);return el}
document.getElementById('prev').replaceChildren(prop('PROPS_0076_PRECEDANT.png',[252,255,1508,565]));
document.getElementById('next').replaceChildren(prop('PROPS_0075_SUIVANT.png',[227,176,1527,581]));
document.querySelector('.back').replaceChildren(prop('PROPS_0077_BUREAU.png',[240,240,1431,514]));
document.getElementById('return').replaceChildren(prop('BD/PROPS_0031_CHOIX.png',[385,317,1151,449]));
document.querySelector('.zoom-controls label').replaceChildren(prop('BD/PROPS_0011_BD-ZOOM.png',[207,370,1528,253]));
const bdBounds=[[324,262,1160,526],[321,259,1186,527],[330,253,1183,546],[329,267,1124,513],[329,286,1177,511],[327,262,1167,534],[329,275,1180,517],[314,243,1142,543]];
const base="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/BD/";
const sets={
  1:Array.from({length:7},(_,i)=>base+'1/1_0007s_'+String(i).padStart(4,'0')+'_1.png'),
  2:Array.from({length:7},(_,i)=>base+'2/2_0006s_'+String(i).padStart(4,'0')+'_2.png'),
  3:Array.from({length:7},(_,i)=>base+'3/3_0005s_'+String(i).padStart(4,'0')+'_3.png'),
  4:Array.from({length:7},(_,i)=>base+'4/4_0004s_'+String(i).padStart(4,'0')+'_4.png'),
  5:Array.from({length:7},(_,i)=>base+'5/5_0003s_'+String(i).padStart(4,'0')+'_5.png'),
  6:Array.from({length:7},(_,i)=>base+'6/6_0002s_'+String(i).padStart(4,'0')+'_6.png'),
  7:Array.from({length:7},(_,i)=>base+'7/7_0001s_'+String(i).padStart(4,'0')+'_7.png'),
  8:Array.from({length:24},(_,i)=>base+'BD_P_'+String(23-i).padStart(4,'0')+'_BD P'+(i+1)+'.jpg')
};

const digitBounds={1:[715,208,352,485],2:[737,215,382,477],3:[745,222,317,471],4:[686,216,383,463],5:[731,203,339,484],6:[741,212,316,502],7:[737,250,310,435],8:[746,226,300,492],9:[730,237,321,467],10:[632,194,568,522],11:[679,224,506,468],12:[637,207,577,490],13:[635,215,540,485],14:[636,233,547,471],15:[644,199,511,508],16:[657,208,527,495],17:[636,215,521,490],18:[638,201,500,509],19:[647,213,489,495],20:[624,219,590,481],21:[641,199,599,503],22:[616,218,536,472],23:[608,223,572,463],24:[562,229,583,460],25:[606,224,510,472]};
function numProp(n){const b=digitBounds[n];if(!b){const e=document.createElement('span');e.textContent=n;return e}const el=prop('PROPS_'+String(74-n).padStart(4,'0')+'_'+n+'.png',b);el.classList.add('bd-number');return el}
function bdLabel(n){const b=bdBounds[n-1];const el=prop('BD/PROPS_'+String(40-n).padStart(4,'0')+'_BD'+n+'.png',b);el.classList.add('bd-label');return el}
function separatorArt(){const el=prop('PROPS_0074__.png',[788,324,147,380]);el.classList.add('bd-separator');return el}
function renderCount(){count.replaceChildren(numProp(spread*2+1),separatorArt(),numProp(Math.min(spread*2+2,sets[book].length)),separatorArt(),numProp(sets[book].length),separatorArt(),bdLabel(book))}
const choice=document.getElementById('choice'),reader=document.getElementById('reader'),pdfs=document.getElementById('pdfs');
const count=document.getElementById('count'),spreadLayer=document.querySelector('.page-spread');
spreadLayer.innerHTML='<img id="newSpread" alt="Double page de bande dessinée"><img id="eightLeft" alt="Page gauche"><img id="eightRight" alt="Page droite">';
const newSpread=document.getElementById('newSpread'),eightLeft=document.getElementById('eightLeft'),eightRight=document.getElementById('eightRight');
let book=1,spread=0;
const inkCache=new Map();
function transparentInk(url){
 if(inkCache.has(url))return inkCache.get(url);
 const promise=new Promise(resolve=>{
  const img=new Image();img.crossOrigin='anonymous';
  img.onload=()=>{
   try{
    const canvas=document.createElement('canvas');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
    const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0);
    const pixels=ctx.getImageData(0,0,canvas.width,canvas.height),data=pixels.data;
    let minX=canvas.width,minY=canvas.height,maxX=-1,maxY=-1;
    for(let y=0;y<canvas.height;y++)for(let x=0;x<canvas.width;x++){
     const i=(y*canvas.width+x)*4;
     const brightness=Math.min(data[i],data[i+1],data[i+2]);
     if(brightness<190&&data[i+3]>50){minX=Math.min(minX,x);minY=Math.min(minY,y);maxX=Math.max(maxX,x);maxY=Math.max(maxY,y)}
     data[i]=0;data[i+1]=0;data[i+2]=0;
     data[i+3]=Math.round(data[i+3]*(255-brightness)/255);
    }
    ctx.putImageData(pixels,0,0);
    if(maxX<minX){resolve(canvas.toDataURL('image/png'));return}
    const marginX=Math.round((maxX-minX+1)*0.035),marginY=Math.round((maxY-minY+1)*0.035);
    const x=Math.max(0,minX-marginX),y=Math.max(0,minY-marginY);
    const w=Math.min(canvas.width-x,maxX+marginX-x+1),h=Math.min(canvas.height-y,maxY+marginY-y+1);
    const cropped=document.createElement('canvas');cropped.width=w;cropped.height=h;
    cropped.getContext('2d').drawImage(canvas,x,y,w,h,0,0,w,h);
    resolve(cropped.toDataURL('image/png'));
   }catch(e){resolve(url)}
  };
  img.onerror=()=>resolve(url);img.src=url;
 });
 inkCache.set(url,promise);return promise;
}
function mode(name){choice.style.display=name==='choice'?'block':'none';reader.style.display=name==='reader'?'flex':'none';pdfs.style.display=name==='pdfs'?'flex':'none'}
function draw(){
 const files=sets[book],isEight=book===8,total=Math.ceil(files.length/2);
 spread=Math.max(0,Math.min(total-1,spread));
 reader.classList.toggle('book-eight',isEight);reader.classList.toggle('book-one',book===1);
 newSpread.style.display='none';
 eightLeft.style.display='block';
 eightRight.style.display=files[spread*2+1]?'block':'none';
 const leftUrl=files[spread*2],rightUrl=files[spread*2+1];
 const currentBook=book,currentSpread=spread;
 eightLeft.removeAttribute('src');eightRight.removeAttribute('src');
 transparentInk(leftUrl).then(src=>{if(book===currentBook&&spread===currentSpread)eightLeft.src=src});
 if(rightUrl)transparentInk(rightUrl).then(src=>{if(book===currentBook&&spread===currentSpread)eightRight.src=src});
 renderCount();
}
function openBook(n){book=n;spread=0;resetMagnifier();mode('reader');draw()}
function move(dir){const max=Math.ceil(sets[book].length/2)-1;spread=Math.max(0,Math.min(max,spread+dir));draw()}

// Zoom réglable librement et retour immédiat à la taille d'origine.
const bookElement=document.querySelector('.book');
const zoomRange=document.getElementById('zoomRange'),zoomValue=document.getElementById('zoomValue');
const resetButton=document.getElementById('resetZoom');
let zoomScale=1,zoomX=0,zoomY=0,dragState=null;
function clampMagnifier(){
 const w=bookElement.offsetWidth,h=bookElement.offsetHeight;
 zoomX=Math.max(-(zoomScale-1)*w/2,Math.min((zoomScale-1)*w/2,zoomX));
 zoomY=Math.max(-(zoomScale-1)*h/2,Math.min((zoomScale-1)*h/2,zoomY));
}
function renderMagnifier(){
 bookElement.style.transform='translate('+zoomX+'px,'+zoomY+'px) scale('+zoomScale+')';
 bookElement.classList.toggle('zoomed',zoomScale>1);
 zoomRange.value=String(Math.round(zoomScale*100));
 zoomValue.textContent=Math.round(zoomScale*100)+' %';
 resetButton.disabled=zoomScale===1;
}
function resetMagnifier(){zoomScale=1;zoomX=0;zoomY=0;dragState=null;bookElement.classList.remove('dragging');renderMagnifier()}
function changeZoom(next){zoomScale=Math.max(1,Math.min(3.5,next));if(zoomScale===1){zoomX=0;zoomY=0}else clampMagnifier();renderMagnifier()}
zoomRange.addEventListener('input',()=>changeZoom(Number(zoomRange.value)/100));
document.getElementById('zoomOut').onclick=()=>changeZoom(Math.round(zoomScale*10-1)/10);
document.getElementById('zoomIn').onclick=()=>changeZoom(Math.round(zoomScale*10+1)/10);
resetButton.onclick=resetMagnifier;
bookElement.addEventListener('wheel',e=>{if(reader.style.display!=='flex')return;e.preventDefault();changeZoom(zoomScale+(e.deltaY<0?0.1:-0.1))},{passive:false});
bookElement.addEventListener('pointerdown',e=>{if(zoomScale<=1)return;dragState={x:e.clientX,y:e.clientY,ox:zoomX,oy:zoomY};bookElement.classList.add('dragging');bookElement.setPointerCapture(e.pointerId)});
bookElement.addEventListener('pointermove',e=>{if(!dragState)return;zoomX=dragState.ox+e.clientX-dragState.x;zoomY=dragState.oy+e.clientY-dragState.y;clampMagnifier();renderMagnifier()});
function endDrag(){dragState=null;bookElement.classList.remove('dragging')}
bookElement.addEventListener('pointerup',endDrag);bookElement.addEventListener('pointercancel',endDrag);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&reader.style.display==='flex'&&zoomScale>1)resetMagnifier()});

document.getElementById('openPdf').onclick=()=>mode('pdfs');
document.getElementById('return').onclick=()=>{resetMagnifier();mode('choice')};
document.getElementById('pdfBack').onclick=()=>mode('choice');
document.getElementById('prev').onclick=()=>move(-1);
document.getElementById('next').onclick=()=>move(1);
document.addEventListener('keydown',e=>{if(reader.style.display!=='flex')return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});
for(let i=1;i<=8;i++){
 const a=document.createElement('a');a.href='#';a.textContent='BD '+i;a.onclick=e=>{e.preventDefault();openBook(i)};document.getElementById('pdfGrid').append(a);
 const h=document.createElement('button');h.type='button';h.setAttribute('aria-label','Ouvrir BD '+i);h.title='BD '+i;h.style.left=((i-1)*12.5)+'%';h.style.width='12.5%';h.onclick=()=>openBook(i);document.getElementById('hotspots').append(h);
}
</script></body></html>
