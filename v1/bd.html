<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BD — Musée numérique</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Tahoma,Verdana,sans-serif;color:white;background:#141414 url('https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/BD/BD_FOND.png') center/cover no-repeat}.back{position:fixed;top:12px;left:12px;z-index:20;padding:9px 12px;background:#ece9d8;color:#111;text-decoration:none;border:2px outset white}.choice{position:fixed;inset:0;display:block;background:url('https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/BD/BDCHOIX.png') center/100% 100% no-repeat}.choice-hotspots{position:absolute;inset:0;pointer-events:none}.choice-hotspots button{position:absolute;top:0;height:100%;pointer-events:auto;cursor:pointer;opacity:0;background:transparent;border:0;display:block}.choice-hotspots button:focus-visible{opacity:1;outline:3px solid #ff59b7}.choice-actions{position:absolute;bottom:1%;right:1%;display:flex;gap:12px;opacity:0;pointer-events:none}.choice-actions button,.toolbar button{cursor:pointer;padding:9px 14px;background:#ece9d8;border:2px outset white;color:#111;font-family:inherit}.reader{display:none;position:fixed;inset:0;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:url('https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/BD/BD_FOND.png') center/cover no-repeat}.book{position:relative;width:min(100vw,1600px);height:min(88vh,1000px);perspective:1500px;display:flex;align-items:center;justify-content:center}.book-decoration{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;opacity:1;z-index:0;transform:scale(1.55)}.page-spread{position:absolute;left:18.5%;top:16%;width:63%;height:66%;display:flex;filter:none;z-index:1;gap:0.6%;perspective:1200px;min-width:0;min-height:0}.page:first-child{clip-path:polygon(3% 2%,100% 0%,100% 100%,0% 97%);transform:perspective(900px) rotateY(4deg);transform-origin:right center}.page:nth-child(2){clip-path:polygon(0 0,97% 2%,100% 97%,0 100%);transform:perspective(900px) rotateY(-4deg);transform-origin:left center}.page{flex:1 1 0;width:0;min-width:0;height:100%;background:transparent;border:0;box-shadow:none;position:relative;overflow:hidden;mix-blend-mode:multiply;opacity:.88}.page img,.page canvas{width:100%;height:100%;max-width:100%;max-height:100%;object-fit:fill;display:block}.page canvas{display:none}.page-turn{display:none!important}.page-turn.active{display:block;animation:flip .52s ease-in-out forwards}.page-turn img{width:100%;height:100%;object-fit:contain;background:white;backface-visibility:hidden}@keyframes flip{from{transform:rotateY(0deg)}to{transform:rotateY(-180deg)}}.toolbar{display:flex;align-items:center;justify-content:center;gap:12px;background:#0009;padding:8px;border-radius:6px}.toolbar span{min-width:105px;text-align:center}.pdfs{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:url('https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/BD/BD_FOND.png') center/cover no-repeat}.pdf-grid{display:grid;grid-template-columns:repeat(4,minmax(90px,1fr));gap:14px;max-width:80vw}.pdf-grid a{display:block;padding:24px 16px;background:#ece9d8;color:#111;text-align:center;border:3px outset white;text-decoration:none}.pdfs button{padding:9px 14px}.help{font-size:12px;background:#0009;padding:5px 9px}@media(max-width:700px){.page-spread{left:18.5%;top:16%;width:63%;height:66%}.book{height:68vh}.pdf-grid{grid-template-columns:repeat(2,minmax(90px,1fr))}}
</style></head><body><a class="back" href="./index.html">← Bureau</a><section class="choice" id="choice"><div class="choice-hotspots" id="hotspots" aria-label="Choisir une BD"></div><div class="choice-actions"><button id="openPdf">Choisir une BD (1 à 8)</button></div></section><section class="reader" id="reader"><div class="book"><img class="book-decoration" src="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/BD/LIVRE.png" alt=""><div class="page-spread"><div class="page" id="leftPage"><img id="left" alt="Page de gauche"><canvas id="leftCanvas"></canvas></div><div class="page" id="rightPage"><img id="right" alt="Page de droite"><canvas id="rightCanvas"></canvas></div><div class="page-turn" id="turn"><img id="turnImage" alt=""></div></div></div><div class="toolbar"><button id="prev">◀ Précédent</button><span id="count"></span><button id="next">Suivant ▶</button><button id="return">Choix</button></div><div class="help">Flèches du clavier pour tourner les pages</div></section><section class="pdfs" id="pdfs"><div class="pdf-grid" id="pdfGrid"></div><button id="pdfBack">Retour au choix</button></section><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script>
const base="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/BD/",pages=Array.from({length:24},(_,i)=>base+'BD P'+(i+1)+'.jpg');
const choice=document.getElementById('choice'),reader=document.getElementById('reader'),pdfs=document.getElementById('pdfs'),left=document.getElementById('left'),right=document.getElementById('right'),leftCanvas=document.getElementById('leftCanvas'),rightCanvas=document.getElementById('rightCanvas'),count=document.getElementById('count'),turn=document.getElementById('turn'),turnImage=document.getElementById('turnImage');
let book=8,pdf=null,spread=0,busy=false,renderToken=0;
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
function mode(name){choice.style.display=name==='choice'?'block':'none';reader.style.display=name==='reader'?'flex':'none';pdfs.style.display=name==='pdfs'?'flex':'none'}
function pageCount(){return book===8?24:(pdf?pdf.numPages:0)}
async function draw(){const token=++renderToken,total=pageCount();count.textContent=(spread*2+1)+'–'+Math.min(spread*2+2,total)+' / '+total+' · BD '+book;
if(book===8){left.style.display=right.style.display='block';leftCanvas.style.display=rightCanvas.style.display='none';left.src=pages[spread*2]||'';right.src=pages[spread*2+1]||'';return}
left.style.display=right.style.display='none';leftCanvas.style.display=rightCanvas.style.display='block';
for(const [canvas,num] of [[leftCanvas,spread*2+1],[rightCanvas,spread*2+2]]){const ctx=canvas.getContext('2d');if(num>total){canvas.width=10;canvas.height=10;ctx.clearRect(0,0,10,10);continue}const p=await pdf.getPage(num);if(token!==renderToken)return;const view=p.getViewport({scale:1.5});canvas.width=view.width;canvas.height=view.height;await p.render({canvasContext:ctx,viewport:view}).promise;if(token!==renderToken)return}}
async function openBook(n){book=n;spread=0;pdf=null;mode('reader');count.textContent='Chargement de la BD '+n+'…';if(n!==8){if(!window.pdfjsLib){count.textContent='Lecteur PDF indisponible';return}try{pdf=await pdfjsLib.getDocument({url:base+n+'.pdf',disableRange:true}).promise}catch(err){count.textContent='Erreur de chargement PDF';console.error(err);return}}await draw()}
async function move(dir){if(busy)return;const next=Math.max(0,Math.min(Math.ceil(pageCount()/2)-1,spread+dir));if(next===spread)return;busy=true;spread=next;await draw();busy=false}
document.getElementById('openPdf').onclick=()=>mode('pdfs');document.getElementById('return').onclick=()=>mode('choice');document.getElementById('pdfBack').onclick=()=>mode('choice');document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.addEventListener('keydown',e=>{if(reader.style.display!=='flex')return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});
for(let i=1;i<=8;i++){const a=document.createElement('a');a.href='#';a.textContent='BD '+i;a.onclick=e=>{e.preventDefault();openBook(i)};document.getElementById('pdfGrid').append(a);const h=document.createElement('button');h.type='button';h.setAttribute('aria-label','Ouvrir BD '+i);h.title='BD '+i;h.style.left=((i-1)*12.5)+'%';h.style.width='12.5%';h.onclick=()=>openBook(i);document.getElementById('hotspots').append(h)}
</script></body></html>
