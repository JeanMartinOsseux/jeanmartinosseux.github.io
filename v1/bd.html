<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BD — Musée numérique</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Tahoma,Verdana,sans-serif;color:#fff;background:#b7a064}.back{position:fixed;top:12px;left:12px;z-index:20;padding:9px 12px;background:#ece9d8;color:#111;text-decoration:none;border:2px outset white}.choice{position:fixed;inset:0;background:url('https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/BD/BDCHOIX.png') center/100% 100% no-repeat}.choice-hotspots{position:absolute;inset:0;pointer-events:none}.choice-hotspots button{position:absolute;top:0;height:100%;pointer-events:auto;cursor:pointer;opacity:0;background:transparent;border:0}.choice-hotspots button:focus-visible{opacity:1;outline:3px solid #ff59b7}.choice-actions{display:none}.reader,.pdfs{display:none;position:fixed;inset:0;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:url('https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/BD/BD_FOND.png') center/cover no-repeat}.book{position:relative;width:min(91vw,calc(77vh * 1.5));aspect-ratio:1.5/1;height:auto;flex-shrink:0;isolation:isolate}.book-decoration{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;z-index:0}.page-spread{position:absolute;left:7%;top:7%;width:86%;height:85%;z-index:1;pointer-events:none;mix-blend-mode:multiply}.page-spread img{position:absolute;display:block;mix-blend-mode:multiply;opacity:1;background:transparent;border:0;max-width:none;transform:none;clip-path:none}.page-spread #newSpread{display:none!important}.page-spread #eightLeft{left:0;top:0;width:50%;height:100%;object-fit:fill}.page-spread #eightRight{left:50%;top:0;width:50%;height:100%;object-fit:fill}.toolbar{display:flex;align-items:center;justify-content:center;gap:12px;background:#0009;padding:8px;border-radius:6px}.toolbar button,.pdfs button{cursor:pointer;padding:9px 14px;background:#ece9d8;border:2px outset white;color:#111;font-family:inherit}.toolbar span{min-width:105px;text-align:center}.help{font-size:12px;background:#0009;padding:5px 9px}.pdf-grid{display:grid;grid-template-columns:repeat(4,minmax(90px,1fr));gap:14px;max-width:80vw}.pdf-grid a{display:block;padding:24px 16px;background:#ece9d8;color:#111;text-align:center;border:3px outset white;text-decoration:none}@media(max-width:700px){.book{width:min(96vw,calc(68vh * 1.5));height:auto}.pdf-grid{grid-template-columns:repeat(2,minmax(90px,1fr))}}</style></head><body><a class="back" href="./index.html">← Bureau</a><section class="choice" id="choice"><div class="choice-hotspots" id="hotspots" aria-label="Choisir une BD"></div><div class="choice-actions"><button id="openPdf">Choisir une BD (1 à 8)</button></div></section><section class="reader" id="reader"><div class="book"><img class="book-decoration" src="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/BD/LIVRE.png" alt=""><div class="page-spread"><div class="page" id="leftPage"><img id="left" alt="Page de gauche"><canvas id="leftCanvas"></canvas></div><div class="page" id="rightPage"><img id="right" alt="Page de droite"><canvas id="rightCanvas"></canvas></div><div class="page-turn" id="turn"><img id="turnImage" alt=""></div></div></div><div class="toolbar"><button id="prev">◀ Précédent</button><span id="count"></span><button id="next">Suivant ▶</button><button id="return">Choix</button></div><div class="help">Flèches du clavier pour tourner les pages</div></section><section class="pdfs" id="pdfs"><div class="pdf-grid" id="pdfGrid"></div><button id="pdfBack">Retour au choix</button></section><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script>
const base="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/BD/";
const sets={
  1:Array.from({length:7},(_,i)=>base+'1/1_0007s_'+String(i).padStart(4,'0')+'_1.png'),
  2:Array.from({length:7},(_,i)=>base+'2/2_0006s_'+String(i).padStart(4,'0')+'_2.png'),
  3:Array.from({length:7},(_,i)=>base+'3/3_0005s_'+String(i).padStart(4,'0')+'_3.png'),
  4:Array.from({length:7},(_,i)=>base+'4/4_0004s_'+String(i).padStart(4,'0')+'_4.png'),
  5:Array.from({length:7},(_,i)=>base+'5/5_0003s_'+String(i).padStart(4,'0')+'_5.png'),
  6:Array.from({length:7},(_,i)=>base+'6/6_0002s_'+String(i).padStart(4,'0')+'_6.png'),
  7:Array.from({length:7},(_,i)=>base+'7/7_0001s_'+String(i).padStart(4,'0')+'_7.png'),
  8:Array.from({length:24},(_,i)=>base+'BD_P_'+String(23-i).padStart(4,'0')+'_BD P'+(i+1)+'.jpg')
};
const choice=document.getElementById('choice'),reader=document.getElementById('reader'),pdfs=document.getElementById('pdfs');
const count=document.getElementById('count'),spreadLayer=document.querySelector('.page-spread');
spreadLayer.innerHTML='<img id="newSpread" alt="Double page de bande dessinée"><img id="eightLeft" alt="Page gauche"><img id="eightRight" alt="Page droite">';
const newSpread=document.getElementById('newSpread'),eightLeft=document.getElementById('eightLeft'),eightRight=document.getElementById('eightRight');
let book=1,spread=0;
function mode(name){choice.style.display=name==='choice'?'block':'none';reader.style.display=name==='reader'?'flex':'none';pdfs.style.display=name==='pdfs'?'flex':'none'}
function draw(){
 const files=sets[book],isEight=book===8,total=Math.ceil(files.length/2);
 spread=Math.max(0,Math.min(total-1,spread));
 reader.classList.toggle('book-eight',isEight);
 newSpread.style.display='none';
 eightLeft.style.display='block';
 eightRight.style.display=files[spread*2+1]?'block':'none';
 eightLeft.src=files[spread*2];if(files[spread*2+1])eightRight.src=files[spread*2+1];
 count.textContent=(spread*2+1)+'–'+Math.min(spread*2+2,files.length)+' / '+files.length+' · BD '+book;
}
function openBook(n){book=n;spread=0;mode('reader');draw()}
function move(dir){const max=Math.ceil(sets[book].length/2)-1;spread=Math.max(0,Math.min(max,spread+dir));draw()}
document.getElementById('openPdf').onclick=()=>mode('pdfs');
document.getElementById('return').onclick=()=>mode('choice');
document.getElementById('pdfBack').onclick=()=>mode('choice');
document.getElementById('prev').onclick=()=>move(-1);
document.getElementById('next').onclick=()=>move(1);
document.addEventListener('keydown',e=>{if(reader.style.display!=='flex')return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});
for(let i=1;i<=8;i++){
 const a=document.createElement('a');a.href='#';a.textContent='BD '+i;a.onclick=e=>{e.preventDefault();openBook(i)};document.getElementById('pdfGrid').append(a);
 const h=document.createElement('button');h.type='button';h.setAttribute('aria-label','Ouvrir BD '+i);h.title='BD '+i;h.style.left=((i-1)*12.5)+'%';h.style.width='12.5%';h.onclick=()=>openBook(i);document.getElementById('hotspots').append(h);
}
</script></body></html>
