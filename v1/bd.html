<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BD — Musée numérique</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Tahoma,Verdana,sans-serif;color:white;background:#141414 url('https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/BD/BD_FOND.png') center/cover no-repeat}.back{position:fixed;top:12px;left:12px;z-index:20;padding:9px 12px;background:#ece9d8;color:#111;text-decoration:none;border:2px outset white}.choice{position:fixed;inset:0;display:grid;place-items:center;background:url('https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/BD/BDCHOIX.png') center/contain no-repeat,url('https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/BD/BD_FOND.png') center/cover no-repeat}.choice-actions{position:absolute;bottom:6%;left:50%;transform:translateX(-50%);display:flex;gap:12px}.choice-actions button,.toolbar button{cursor:pointer;padding:9px 14px;background:#ece9d8;border:2px outset white;color:#111;font-family:inherit}.reader{display:none;position:fixed;inset:0;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:url('https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/BD/BD_FOND.png') center/cover no-repeat}.book{position:relative;width:min(92vw,1150px);height:min(78vh,760px);perspective:1500px;display:flex;align-items:center;justify-content:center}.book-decoration{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;opacity:.9}.page-spread{position:relative;width:78%;height:88%;display:flex;filter:drop-shadow(3px 8px 12px #0009)}.page{width:50%;height:100%;background:#eee;object-fit:contain;border:1px solid #555;box-shadow:inset 0 0 10px #0004}.page-turn{position:absolute;top:0;left:50%;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;pointer-events:none;z-index:6;display:none}.page-turn.active{display:block;animation:flip .52s ease-in-out forwards}.page-turn img{width:100%;height:100%;object-fit:contain;background:white;backface-visibility:hidden}@keyframes flip{from{transform:rotateY(0deg)}to{transform:rotateY(-180deg)}}.toolbar{display:flex;align-items:center;justify-content:center;gap:12px;background:#0009;padding:8px;border-radius:6px}.toolbar span{min-width:105px;text-align:center}.pdfs{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:url('https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/BD/BD_FOND.png') center/cover no-repeat}.pdf-grid{display:grid;grid-template-columns:repeat(4,minmax(90px,1fr));gap:14px;max-width:80vw}.pdf-grid a{display:block;padding:24px 16px;background:#ece9d8;color:#111;text-align:center;border:3px outset white;text-decoration:none}.pdfs button{padding:9px 14px}.help{font-size:12px;background:#0009;padding:5px 9px}@media(max-width:700px){.page-spread{width:94%;height:70%}.book{height:68vh}.pdf-grid{grid-template-columns:repeat(2,minmax(90px,1fr))}}
</style></head><body><a class="back" href="./index.html">← Bureau</a><section class="choice" id="choice"><div class="choice-actions"><button id="openPdf">Choisir une BD (1 à 8)</button></div></section><section class="reader" id="reader"><div class="book"><img class="book-decoration" src="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/BD/LIVRE.png" alt=""><div class="page-spread"><img class="page" id="left" alt="Page de gauche"><img class="page" id="right" alt="Page de droite"><div class="page-turn" id="turn"><img id="turnImage" alt=""></div></div></div><div class="toolbar"><button id="prev">◀ Précédent</button><span id="count"></span><button id="next">Suivant ▶</button><button id="return">Choix</button></div><div class="help">Flèches du clavier pour tourner les pages</div></section><section class="pdfs" id="pdfs"><div class="pdf-grid" id="pdfGrid"></div><button id="pdfBack">Retour au choix</button></section><script>
const base="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/BD/",pages=Array.from({length:24},(_,i)=>base+'BD P'+(i+1)+'.jpg');let spread=0,busy=false;const choice=document.getElementById('choice'),reader=document.getElementById('reader'),pdfs=document.getElementById('pdfs'),left=document.getElementById('left'),right=document.getElementById('right'),count=document.getElementById('count'),turn=document.getElementById('turn'),turnImage=document.getElementById('turnImage');function mode(name){choice.style.display=name==='choice'?'grid':'none';reader.style.display=name==='reader'?'flex':'none';pdfs.style.display=name==='pdfs'?'flex':'none'}function draw(){left.src=pages[spread*2]||'';right.src=pages[spread*2+1]||'';count.textContent=(spread*2+1)+'–'+Math.min(spread*2+2,pages.length)+' / '+pages.length}function move(dir){if(busy)return;const next=Math.max(0,Math.min(11,spread+dir));if(next===spread)return;busy=true;turnImage.src=dir>0?right.src:left.src;turn.style.left=dir>0?'50%':'0';turn.style.transformOrigin=dir>0?'left center':'right center';turn.style.animationDirection=dir>0?'normal':'reverse';turn.classList.remove('active');void turn.offsetWidth;turn.classList.add('active');setTimeout(()=>{spread=next;draw();turn.classList.remove('active');busy=false},520)}document.getElementById('openPdf').onclick=()=>mode('pdfs');document.getElementById('return').onclick=()=>mode('choice');document.getElementById('pdfBack').onclick=()=>mode('choice');document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.addEventListener('keydown',e=>{if(reader.style.display!=='flex')return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});for(let i=1;i<=8;i++){const a=document.createElement('a');a.textContent='BD '+i;if(i<=7){a.href=base+i+'.pdf';a.target='_blank';a.rel='noopener'}else{a.href='#';a.onclick=e=>{e.preventDefault();spread=0;mode('reader');draw()}}document.getElementById('pdfGrid').append(a)}draw();
</script></body></html>
