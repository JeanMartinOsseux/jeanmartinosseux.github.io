<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photographie — Jean Martin Osseux</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#08070d;font-family:Tahoma,Verdana,sans-serif}
body::before{content:"";position:fixed;inset:-45px;background:url('https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/photos/CAMERA.png') center/cover no-repeat;filter:blur(38px) brightness(.55);transform:scale(1.08);z-index:-1}
.back{position:fixed;top:14px;left:14px;z-index:10;background:#ece9d8;border:2px outset #fff;padding:9px 12px;color:#111;text-decoration:none}
.stage{height:100dvh;width:100vw;display:grid;place-items:center;overflow:hidden}
.camera{position:relative;width:100vw;height:100dvh;flex:none}
.camera-art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:2;pointer-events:none}
.photo{position:absolute;left:10.8%;top:31.7%;width:85.9%;height:61.5%;object-fit:contain;background:#080808;z-index:3}
.viewfinder{position:absolute;left:54%;top:2.3%;width:22.8%;height:14.8%;object-fit:cover;border-radius:17%;z-index:3}
.nav{position:absolute;z-index:5;top:14%;transform:translateY(-50%);width:10%;height:10%;border:0;background:transparent;cursor:pointer;color:transparent}
.nav.prev{left:3.5%}.nav.next{left:18.5%}
.nav:focus-visible{outline:3px dashed #f29ad4}
.controls{position:fixed;top:12px;right:12px;z-index:12;display:flex;gap:5px}.controls button{background:#ece9d8;border:2px outset #fff;padding:8px 11px;cursor:pointer;font-family:Tahoma,sans-serif}.controls button:disabled{opacity:.45;cursor:default}.empty{position:absolute;inset:30% 12% 8%;display:none;place-items:center;color:#fff;background:#000b;z-index:4}.counter{position:fixed;bottom:10px;right:14px;z-index:9;color:#fff;background:#000a;padding:5px 9px;font-size:12px}
@media(max-width:700px){.back{top:6px;left:6px}}
</style></head><body><a class="back" href="./index.html">← Bureau</a><main class="stage"><div class="camera" id="camera"><img class="photo" id="photo" alt="Photographie de Jean Martin Osseux"><img class="viewfinder" id="viewfinder" alt="Aperçu dans le viseur"><img class="camera-art" src="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/photos/CAMERA.png" alt="Appareil photo interactif"><button class="nav prev" id="prev" aria-label="Photo précédente">Précédente</button><button class="nav next" id="next" aria-label="Photo suivante">Suivante</button><div class="empty" id="empty">Toutes les photos sont masquées. Utilise ↶ pour les restaurer.</div></div></main><div class="controls"><button id="fs" title="Plein écran">FS</button><button id="delete" title="Masquer cette photo">🗑</button><button id="restore" title="Restaurer la dernière photo masquée">↶</button></div><span class="counter" id="counter"></span><script>
const base="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/photos/";
const photos=Array.from({length:48},(_,i)=>'PHOTOS_'+String(i).padStart(4,'0')+'_'+String(i+1).padStart(2,'0')+'.jpg');
let current=0;const hidden=new Set(),history=[];
const img=document.getElementById('photo'),viewfinder=document.getElementById('viewfinder'),counter=document.getElementById('counter');
const available=()=>photos.map((_,i)=>i).filter(i=>!hidden.has(i));
function show(i){const list=available();if(!list.length){img.style.visibility='hidden';viewfinder.style.visibility='hidden';document.getElementById('empty').style.display='grid';counter.textContent='0 / 48';document.getElementById('delete').disabled=true;return}document.getElementById('empty').style.display='none';img.style.visibility='visible';viewfinder.style.visibility='visible';document.getElementById('delete').disabled=false;current=list.includes(i)?i:list.find(j=>j>=i)??list[0];img.src=base+photos[current];viewfinder.src=img.src;counter.textContent=String(list.indexOf(current)+1).padStart(2,'0')+' / '+list.length}
function step(d){const list=available();if(!list.length)return;const pos=list.indexOf(current);show(list[(pos+d+list.length)%list.length])}
document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);
document.getElementById('delete').onclick=()=>{if(hidden.has(current))return;history.push(current);hidden.add(current);show(current+1);document.getElementById('restore').disabled=false};
document.getElementById('restore').onclick=()=>{if(!history.length)return;const i=history.pop();hidden.delete(i);show(i);document.getElementById('restore').disabled=!history.length};
document.getElementById('restore').disabled=true;
document.getElementById('fs').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){console.warn('Fullscreen unavailable',e)}};
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1);if(e.key==='Delete')document.getElementById('delete').click();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();document.getElementById('restore').click()}});
show(0);
</script></body></html>
