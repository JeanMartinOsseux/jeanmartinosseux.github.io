<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photographie — Jean Martin Osseux</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#151515 url('https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/BG.png') center/cover no-repeat;font-family:Tahoma,Verdana,sans-serif}.back{position:fixed;top:14px;left:14px;z-index:10;background:#ece9d8;border:2px outset #fff;padding:9px 12px;color:#111;text-decoration:none}.stage{height:100dvh;width:100vw;display:grid;place-items:center;overflow:hidden}.camera{position:relative;width:min(96vw,calc(100dvh * 1.5));aspect-ratio:3/2;max-height:96dvh}.camera-art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:2;pointer-events:none}.photo{position:absolute;left:28%;top:24%;width:44%;height:50%;object-fit:contain;background:#090909;z-index:1}.nav{position:absolute;z-index:5;top:50%;transform:translateY(-50%);width:12%;height:25%;border:0;background:transparent;cursor:pointer;color:transparent}.nav.prev{left:4%}.nav.next{right:4%}.nav:focus-visible{outline:3px dashed #f29ad4}.counter{position:fixed;bottom:10px;right:14px;color:#fff;background:#000a;padding:5px 9px;font-size:12px}.camera.failed .photo{z-index:3}@media(max-width:700px){.camera{width:100vw;aspect-ratio:3/2}.back{top:6px;left:6px}}
</style></head><body><a class="back" href="./index.html">← Bureau</a><main class="stage"><div class="camera" id="camera"><img class="photo" id="photo" alt="Photographie de Jean Martin Osseux"><img class="camera-art" src="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/photos/CAMERA.png" alt="Appareil photo interactif"><button class="nav prev" id="prev" aria-label="Photo précédente">Précédente</button><button class="nav next" id="next" aria-label="Photo suivante">Suivante</button></div></main><span class="counter" id="counter"></span><script>
const base="https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/photos/",photos=Array.from({length:48},(_,i)=>'PHOTOS_'+String(i).padStart(4,'0')+'_'+String(i+1).padStart(2,'0')+'.jpg');let current=0;const img=document.getElementById('photo'),counter=document.getElementById('counter');function show(i){current=(i+photos.length)%photos.length;img.src=base+photos[current];counter.textContent=String(current+1).padStart(2,'0')+' / '+photos.length}document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight')show(current+1)});show(0);
</script></body></html>
