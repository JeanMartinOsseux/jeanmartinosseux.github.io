</style></head><body><div class="top"><button class="xp" id="bureauBtn" aria-label="Bureau" onclick="location.href='./index.html'">Bureau</button><span class="coins" id="coins">0</span><button class="xp" id="shopBtn">🛒 Boutique</button><button class="xp" id="collectionBtn">🗂️ Collection</button><button class="xp reset-button" id="resetBtn">↻ Tout réinitialiser</button><span class="hint">Attrape un texte, déplace la souris et relâche pour le lancer !</span></div><main class="court" id="court"><div class="bin" id="bin"><div class="symbol">🗑️</div><div class="name">Corbeille</div></div></main><script>
const base='https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/TEXTE/';
const texts=['GREBIK EST DERRRIERE TOI','3916','121212','KASK','MORDOR ME HANTE','VA AU PULRA','CC CV','444.444.444.','BIENTOT PERF','EXPO'];
const rewards=[...Array.from({length:5},(_,i)=>({id:'illu'+(i+1),name:'Illustration '+(i+1),cost:5,type:'image',file:'illu'+(i+1)+(i===0?'.png':'.jpg')})),...Array.from({length:3},(_,i)=>({id:'anim'+(i+1),name:'Animation Grebik '+(i+1),cost:10,type:'video',file:'anim'+(i+1)+'.mp4'})),{id:'mixtape',name:'Mixtape du Canapé',cost:25,type:'album',file:'0. Mixtape_Canape.jpg'}];
const tracks=['1. je suspecte une grande ouverture de mon frigo.mp3','2. marcher seulement pendant les cratères.mp3','3. SKI T.T LES.mp3','4. on se souvient de lui !!!.mp3','5. cado pour respect du froid.mp3'];
const url=f=>base+encodeURIComponent(f);
const key='jmo_textes_basket_v1';let save={coins:0,owned:[]};try{const s=JSON.parse(localStorage.getItem(key));if(s&&Number.isFinite(s.coins)&&Array.isArray(s.owned))save={coins:Math.max(0,s.coins),owned:s.owned.filter(x=>rewards.some(r=>r.id===x))}}catch(e){}
const persist=()=>{localStorage.setItem(key,JSON.stringify(save));document.querySelector('#coins').textContent=String(save.coins)};persist();
const artBase='https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/PROPS/jeu_texte/';
const court=document.querySelector('#court'),bin=document.querySelector('#bin');let papers=[],active=null,last=performance.now(),won=false,modal=null;let scoredThisRound=new Set();
function spawn(){papers.forEach(p=>p.el.remove());papers=[];scoredThisRound.clear();won=false;const w=innerWidth,h=innerHeight;texts.forEach((t,i)=>{const el=document.createElement('div');el.className='paper';el.textContent=t;el.setAttribute('aria-label',t);el.title=t;el.style.backgroundImage='url("'+artBase+'PROPS_'+String(10-i).padStart(4,'0')+'_TXT-JEU-'+(i+1)+'.png")';court.append(el);const p={el,x:Math.max(95,Math.min(w-95,w*(.07+i*.095))),y:Math.max(105,h*.12-(i%3)*90),vx:0,vy:0.5,done:false,held:false,history:[],launched:false,passedAbove:false,index:i};papers.push(p);el.style.left=p.x+'px';el.style.top=p.y+'px';el.addEventListener('pointerdown',e=>{if(modal||p.done)return;e.preventDefault();active=p;p.held=true;p.vx=p.vy=0;p.launched=false;p.passedAbove=false;p.history=[{x:e.clientX,y:e.clientY,t:performance.now()}];el.classList.add('held');el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(active!==p)return;const now=performance.now();p.x=e.clientX;p.y=e.clientY;p.history.push({x:p.x,y:p.y,t:now});p.history=p.history.filter(q=>now-q.t<130);draw(p)});const release=e=>{if(active!==p)return;const a=p.history[0],b=p.history[p.history.length-1],dt=Math.max(16,b.t-a.t);p.vx=Math.max(-22,Math.min(22,(b.x-a.x)/dt*18));p.vy=Math.max(-24,Math.min(24,(b.y-a.y)/dt*18));p.launched=Math.hypot(p.vx,p.vy)>3 && p.vy< -2 && p.y>bin.getBoundingClientRect().top+bin.offsetHeight*.42;p.passedAbove=false;p.held=false;active=null;el.classList.remove('held')};el.addEventListener('pointerup',release);el.addEventListener('pointercancel',release);draw(p)})}
function draw(p){p.el.style.left=p.x+'px';p.el.style.top=p.y+'px'}
function score(p){
 p.done=true;p.el.remove();bin.classList.remove('flash');void bin.offsetWidth;bin.classList.add('flash');
 if(!scoredThisRound.has(p.index)){
  scoredThisRound.add(p.index);save.coins++;persist();
  const pop=document.createElement('div');pop.className='coin-pop';
  for(const file of ['PROPS_0021_+1.png','PROPS_0022_PIECE.png']){const img=document.createElement('img');img.src=artBase+file;img.alt='';pop.append(img)}
  document.body.append(pop);
  requestAnimationFrame(()=>{requestAnimationFrame(()=>{pop.style.opacity='0';pop.style.top='22%'})});
  setTimeout(()=>pop.remove(),1300);
 }
 if(papers.every(q=>q.done)&&!won){won=true;const m=document.createElement('div');m.className='message';m.textContent='🏆 Tous les textes jetés ! Nouvelle manche !';document.body.append(m);setTimeout(()=>{m.remove();spawn()},1800)}
}
function spillBin(){
 if(modal||bin.dataset.spilling==='yes')return;
 const stored=papers.filter(p=>p.done);if(!stored.length)return;
 bin.dataset.spilling='yes';
 const r=bin.getBoundingClientRect(),cx=r.left+r.width*.5,cy=r.top+r.height*.42;
 stored.forEach((p,i)=>{
  p.done=false;p.held=false;p.launched=false;p.passedAbove=false;
  p.x=cx+(i-(stored.length-1)/2)*6;p.y=cy+(i%3)*4;
  p.vx=(i-(stored.length-1)/2)*1.7;
  p.vy=-7-(i%4)*1.3;
  court.append(p.el);p.el.classList.add('spilled');draw(p);
  setTimeout(()=>p.el.classList.remove('spilled'),1300);
 });
 setTimeout(()=>{delete bin.dataset.spilling},650);
}
bin.addEventListener('click',spillBin);
function frame(now){const dt=Math.min(2.5,(now-last)/16.67);last=now;if(!modal){const r=bin.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height*.52;for(const p of papers){if(p.done||p.held)continue;if(p.vx||p.vy){p.vy+=.34*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.993,dt);const half=p.el.offsetWidth/2;if(p.x<half){p.x=half;p.vx=Math.abs(p.vx)*.5}if(p.x>innerWidth-half){p.x=innerWidth-half;p.vx=-Math.abs(p.vx)*.5}if(p.y>innerHeight-65){p.y=innerHeight-65;/* No sideways collision correction: each paper lands naturally without jumping away from neighbours. */p.vy=-Math.abs(p.vy)*.35;p.vx*=.78;if(Math.abs(p.vy)<1.1){p.vy=0;if(Math.abs(p.vx)<.3)p.vx=0}}if(p.y<75){p.y=75;p.vy=Math.abs(p.vy)*.4}if(p.launched&&p.y<cy-48)p.passedAbove=true;if(p.launched&&p.passedAbove&&Math.abs(p.x-cx)<34&&p.y>cy-20&&p.y<cy+22&&p.vy>1){score(p);continue}draw(p)}}}requestAnimationFrame(frame)}spawn();requestAnimationFrame(frame);
document.getElementById('resetBtn').onclick=()=>{if(!confirm('Réinitialiser complètement le jeu ? Toutes tes pièces et tous les objets achetés dans la boutique et la collection seront perdus.'))return;closeModal();save={coins:0,owned:[]};persist();spawn()};
function closeModal(){if(modal){modal.remove();modal=null}}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function popup(title,wide=false){closeModal();const overlay=document.createElement('div');overlay.className='overlay';overlay.innerHTML='<div class="panel '+(wide?'viewer':'')+'"><div class="bar"><span></span><button class="close">✕</button></div><div class="inside"></div></div>';overlay.querySelector('.bar span').textContent=title;overlay.querySelector('.close').onclick=closeModal;if(!wide){const hit=document.createElement('button');hit.className='modal-close-target';hit.setAttribute('aria-label','Fermer la fenêtre');hit.onclick=closeModal;hit.onpointerdown=e=>{e.stopPropagation();e.preventDefault();closeModal()};overlay.querySelector('.panel').append(hit)}overlay.addEventListener('pointerdown',e=>{if(e.target===overlay)closeModal()});document.body.append(overlay);modal=overlay;return overlay.querySelector('.inside')}
function openStore(collection=false){const inside=popup(collection?'Ma collection':'Boutique — objets à débloquer');const p=document.createElement('p');p.textContent=collection?'Tes objets achetés restent ici, même après avoir quitté le site.':'Solde : '+save.coins+' 🪙 — Chaque achat retire les pièces correspondantes.';inside.append(p);const grid=document.createElement('div');grid.className='shopgrid';inside.append(grid);for(const r of rewards){const owned=save.owned.includes(r.id);if(collection&&!owned)continue;const card=document.createElement('div');card.className='item';let preview;if(r.type==='video'){preview=document.createElement('video');preview.src=url(r.file)+'#t=0.15';preview.preload='metadata';preview.muted=true;preview.playsInline=true;preview.setAttribute('aria-label',r.name)}else{preview=document.createElement('img');preview.src=url(r.file);preview.alt=r.name}if(!owned)preview.className='locked';card.append(preview);const label=document.createElement('strong');label.textContent=r.name;card.append(label);const price=document.createElement('span');price.textContent=owned?'✓ Acheté':r.cost+' 🪙';card.append(price);const b=document.createElement('button');b.className='xp';b.textContent=owned?'Voir / écouter':save.coins>=r.cost?'Acheter':'Pièces insuffisantes';b.dataset.action=owned?(r.type==='album'?'listen':'view'):'buy';b.setAttribute('aria-label',b.textContent);b.disabled=!owned&&save.coins<r.cost;b.onclick=()=>{if(owned){openReward(r,collection);return}if(save.coins<r.cost)return;save.coins-=r.cost;save.owned.push(r.id);persist();openStore(collection)};card.append(b);grid.append(card)}if(collection&&!grid.children.length){const p=document.createElement('p');p.textContent='Ta collection est vide pour le moment. Gagne des pièces et visite la boutique !';inside.append(p)}}
let lastRewardCollection=false;
function openReward(r,fromCollection=false){lastRewardCollection=fromCollection;const inside=popup(r.name,true);modal.classList.add('reward-overlay');const bar=modal.querySelector('.bar');const back=document.createElement('button');back.className='back-to-list';back.textContent='← '+(fromCollection?'Collection':'Boutique');back.onclick=()=>openStore(fromCollection);bar.insertBefore(back,bar.querySelector('.close'));if(r.type==='image'){const img=document.createElement('img');img.src=url(r.file);img.alt=r.name;inside.append(img)}else if(r.type==='video'){const video=document.createElement('video');video.src=url(r.file);video.controls=true;video.autoplay=true;video.playsInline=true;inside.append(video)}else{const layout=document.createElement('div');layout.className='album';const cover=document.createElement('img');cover.src=url(r.file);cover.alt='Pochette de la Mixtape du Canapé';const right=document.createElement('div');right.className='tracks';const audio=document.createElement('audio');audio.controls=true;audio.preload='none';const buttons=[];function play(i){audio.src=url(tracks[i]);audio.play().catch(()=>{});buttons.forEach((b,j)=>b.classList.toggle('active',i===j))}tracks.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t.replace(/\.mp3$/i,'');b.onclick=()=>play(i);buttons.push(b);right.append(b)});audio.addEventListener('ended',()=>{const i=buttons.findIndex(b=>b.classList.contains('active'));if(i>=0&&i<4)play(i+1)});right.append(audio);layout.append(cover,right);inside.append(layout)}}
document.querySelector('#shopBtn').onclick=()=>openStore(false);document.querySelector('#collectionBtn').onclick=()=>openStore(true);
</script></body></html>
