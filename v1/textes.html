<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEXTES — Basket à la corbeille</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px Tahoma,Verdana,sans-serif;background:white;color:#171717;overflow:hidden}button{font:inherit;cursor:pointer}.top{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;z-index:5}.xp{border:1px solid #777;background:linear-gradient(white,#d6d6d6);padding:8px 12px;border-radius:3px;box-shadow:inset 1px 1px white}.xp:hover{background:#dceaff}.coins{font-weight:bold;background:#fff3b9;border:1px solid #c89a28;padding:9px 13px;border-radius:6px}.hint{margin-left:auto;color:#777;font-size:12px}.court{position:absolute;inset:0;overflow:hidden;touch-action:none}.bin{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:132px;height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;user-select:none}.bin .symbol{font-size:94px;line-height:1;filter:drop-shadow(2px 4px 2px #0002)}.bin .name{font-size:12px;text-align:center}.bin.flash .symbol{animation:bounce .3s}@keyframes bounce{50%{transform:scale(1.18)}}.paper{position:absolute;padding:10px 13px;background:linear-gradient(145deg,#fff,#eaeaea);border:1px solid #aaa;box-shadow:2px 3px 4px #0002;cursor:grab;user-select:none;touch-action:none;white-space:nowrap;font-size:clamp(10px,1.15vw,14px);border-radius:2px;transform:translate(-50%,-50%);will-change:left,top;max-width:220px}.paper:active{cursor:grabbing}.paper:before{content:'📄 ';font-size:16px}.paper.held{z-index:4;box-shadow:4px 8px 14px #0004}.message{position:fixed;left:50%;top:20%;transform:translateX(-50%);background:#fff9cf;border:2px solid #d4a132;border-radius:8px;padding:16px 24px;font-size:22px;font-weight:bold;z-index:7;pointer-events:none;text-align:center}.overlay{position:fixed;inset:0;background:#0009;z-index:10;display:flex;align-items:center;justify-content:center;padding:15px}.panel{width:min(950px,96vw);max-height:92vh;overflow:auto;background:#ece9d8;border:3px solid #1556bf;border-radius:9px 9px 3px 3px;box-shadow:5px 8px 30px #0008}.bar{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#4294fa,#0752cc);color:white;padding:7px 10px;font-weight:bold}.close{background:#d7352b;border:1px solid white;color:white;border-radius:3px;padding:3px 9px}.inside{padding:18px}.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px}.item{background:white;border:1px solid #aaa;padding:10px;display:flex;flex-direction:column;gap:8px}.item img,.item video{width:100%;height:120px;object-fit:contain;background:#f1f1f1}.item button{margin-top:auto}.item strong{font-size:13px}.locked{filter:blur(6px);opacity:.55}.viewer{width:min(1100px,98vw)}.viewer .inside{text-align:center;background:#222;color:white}.viewer img,.viewer video{max-width:100%;max-height:75vh;object-fit:contain}.album{display:grid;grid-template-columns:minmax(180px,1fr) minmax(240px,1.3fr);gap:20px;align-items:start;text-align:left}.album img{width:100%;height:auto;max-height:65vh;object-fit:contain}.tracks{display:flex;flex-direction:column;gap:8px}.tracks button{text-align:left;padding:9px;background:#f4f4f4;border:1px solid #aaa}.tracks button.active{background:#c7e0ff}.tracks audio{width:100%;margin-top:10px}@media(max-width:650px){.hint{display:none}.bin{top:42%}.album{grid-template-columns:1fr}.paper{font-size:10px;padding:7px}.album img{max-height:220px}}

html,body{width:100%;height:100%;min-height:100%;margin:0}
body{background-image:url('https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/PROPS/jeu_texte/PROPS_0000_BG-JEU-copy.png')!important;background-position:center center!important;background-size:cover!important;background-repeat:no-repeat!important}

.overlay .panel{position:relative;width:min(1120px,95vw);height:min(790px,92vh);max-height:92vh;overflow:hidden;border:0;border-radius:0;box-shadow:none;background:transparent url('https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/PROPS/PROPS_0029_FENETRES.png') center/100% 100% no-repeat;padding:7% 6% 5%;display:flex;flex-direction:column}

.overlay .close{background:transparent url('https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/PROPS/PROPS_0018_CROIX.png') center/contain no-repeat;border:0;color:transparent;font-size:0;width:54px;height:43px}

.shopgrid .item button[data-action="buy"]{background-image:url('https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/PROPS/jeu_texte/PROPS_0025_ACHETER.png')}

</style></head><body><div class="top"><button class="xp" id="bureauBtn" aria-label="Bureau" onclick="location.href='./index.html'">Bureau</button><span class="coins" id="coins">0</span><button class="xp" id="shopBtn">🛒 Boutique</button><button class="xp" id="collectionBtn">🗂️ Collection</button><button class="xp reset-button" id="resetBtn">↻ Tout réinitialiser</button><span class="hint">Attrape un texte, déplace la souris et relâche pour le lancer !</span></div><main class="court" id="court"><div class="bin" id="bin"><div class="symbol">🗑️</div><div class="name">Corbeille</div></div></main><script>
const base='https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/TEXTE/';
const texts=['GREBIK EST DERRRIERE TOI','3916','121212','KASK','MORDOR ME HANTE','VA AU PULRA','CC CV','444.444.444.','BIENTOT PERF','EXPO'];
const rewards=[...Array.from({length:5},(_,i)=>({id:'illu'+(i+1),name:'Illustration '+(i+1),cost:5,type:'image',file:'illu'+(i+1)+(i===0?'.png':'.jpg')})),...Array.from({length:3},(_,i)=>({id:'anim'+(i+1),name:'Animation Grebik '+(i+1),cost:10,type:'video',file:'anim'+(i+1)+'.mp4'})),{id:'mixtape',name:'Mixtape du Canapé',cost:25,type:'album',file:'0. Mixtape_Canape.jpg'}];
const tracks=['1. je suspecte une grande ouverture de mon frigo.mp3','2. marcher seulement pendant les cratères.mp3','3. SKI T.T LES.mp3','4. on se souvient de lui !!!.mp3','5. cado pour respect du froid.mp3'];
const url=f=>base+encodeURIComponent(f);
const key='jmo_textes_basket_v1';let save={coins:0,owned:[]};try{const s=JSON.parse(localStorage.getItem(key));if(s&&Number.isFinite(s.coins)&&Array.isArray(s.owned))save={coins:Math.max(0,s.coins),owned:s.owned.filter(x=>rewards.some(r=>r.id===x))}}catch(e){}
const persist=()=>{localStorage.setItem(key,JSON.stringify(save));document.querySelector('#coins').textContent=String(save.coins)};persist();
const artBase='https://raw.githubusercontent.com/JeanMartinOsseux/jeanmartinosseux.github.io/v1-musee-numerique/assets/PROPS/jeu_texte/';
const court=document.querySelector('#court'),bin=document.querySelector('#bin');let papers=[],active=null,last=performance.now(),won=false,modal=null;
function spawn(){papers.forEach(p=>p.el.remove());papers=[];won=false;const w=innerWidth,h=innerHeight;texts.forEach((t,i)=>{const el=document.createElement('div');el.className='paper';el.textContent=t;el.setAttribute('aria-label',t);el.title=t;el.style.backgroundImage='url("'+artBase+'PROPS_'+String(10-i).padStart(4,'0')+'_TXT-JEU-'+(i+1)+'.png")';court.append(el);const cols=Math.min(5,texts.length),row=Math.floor(i/cols),col=i%cols;const p={el,x:Math.max(80,Math.min(w-80,(col+.5)*w/cols+(row?22:0))),y:h-65-row*56,vx:0,vy:0,done:false,held:false,history:[],launched:false,passedAbove:false};papers.push(p);el.style.left=p.x+'px';el.style.top=p.y+'px';el.addEventListener('pointerdown',e=>{if(modal||p.done)return;e.preventDefault();active=p;p.held=true;p.vx=p.vy=0;p.launched=false;p.passedAbove=false;p.history=[{x:e.clientX,y:e.clientY,t:performance.now()}];el.classList.add('held');el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(active!==p)return;const now=performance.now();p.x=e.clientX;p.y=e.clientY;p.history.push({x:p.x,y:p.y,t:now});p.history=p.history.filter(q=>now-q.t<130);draw(p)});const release=e=>{if(active!==p)return;const a=p.history[0],b=p.history[p.history.length-1],dt=Math.max(16,b.t-a.t);p.vx=Math.max(-22,Math.min(22,(b.x-a.x)/dt*18));p.vy=Math.max(-24,Math.min(24,(b.y-a.y)/dt*18));p.launched=Math.hypot(p.vx,p.vy)>3 && p.vy< -2 && p.y>bin.getBoundingClientRect().top+bin.offsetHeight*.42;p.passedAbove=false;p.held=false;active=null;el.classList.remove('held')};el.addEventListener('pointerup',release);el.addEventListener('pointercancel',release);draw(p)})}
function draw(p){p.el.style.left=p.x+'px';p.el.style.top=p.y+'px'}
function score(p){p.done=true;p.el.remove();bin.classList.remove('flash');void bin.offsetWidth;bin.classList.add('flash');save.coins++;persist();const pop=document.createElement('div');pop.textContent='';pop.style.cssText='position:fixed;left:50%;top:32%;transform:translateX(-50%);font-size:24px;font-weight:bold;color:#b58a00;text-shadow:0 1px white;pointer-events:none;z-index:8;transition:opacity .6s,top .6s';pop.style.width='160px';pop.style.height='85px';pop.style.background="url('"+artBase+"PROPS_0021_+1.png') left center/65% contain no-repeat, url('"+artBase+"PROPS_0022_PIECE.png') right center/35% contain no-repeat";document.body.append(pop);requestAnimationFrame(()=>{pop.style.opacity='0';pop.style.top='26%'});setTimeout(()=>pop.remove(),650);if(papers.every(q=>q.done)&&!won){won=true;const m=document.createElement('div');m.className='message';m.textContent='🏆 Tous les textes jetés ! Nouvelle manche !';document.body.append(m);setTimeout(()=>{m.remove();spawn()},1800)}}
function frame(now){const dt=Math.min(2.5,(now-last)/16.67);last=now;if(!modal){const r=bin.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height*.52;for(const p of papers){if(p.done||p.held)continue;if(p.vx||p.vy){p.vy+=.34*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.993,dt);const half=p.el.offsetWidth/2;if(p.x<half){p.x=half;p.vx=Math.abs(p.vx)*.5}if(p.x>innerWidth-half){p.x=innerWidth-half;p.vx=-Math.abs(p.vx)*.5}if(p.y>innerHeight-24){p.y=innerHeight-24;p.vy=-Math.abs(p.vy)*.35;p.vx*=.78;if(Math.abs(p.vy)<1.1){p.vy=0;if(Math.abs(p.vx)<.3)p.vx=0}}if(p.y<75){p.y=75;p.vy=Math.abs(p.vy)*.4}if(p.launched&&p.y<cy-48)p.passedAbove=true;if(p.launched&&p.passedAbove&&Math.abs(p.x-cx)<34&&p.y>cy-20&&p.y<cy+22&&p.vy>1){score(p);continue}draw(p)}}}requestAnimationFrame(frame)}spawn();requestAnimationFrame(frame);
document.getElementById('resetBtn').onclick=()=>{if(!confirm('Réinitialiser complètement le jeu ? Toutes tes pièces et tous les objets achetés dans la boutique et la collection seront perdus.'))return;closeModal();save={coins:0,owned:[]};persist();spawn()};
function closeModal(){if(modal){modal.remove();modal=null}}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function popup(title,wide=false){closeModal();const overlay=document.createElement('div');overlay.className='overlay';overlay.innerHTML='<div class="panel '+(wide?'viewer':'')+'"><div class="bar"><span></span><button class="close">✕</button></div><div class="inside"></div></div>';overlay.querySelector('.bar span').textContent=title;overlay.querySelector('.close').onclick=closeModal;overlay.addEventListener('pointerdown',e=>{if(e.target===overlay)closeModal()});document.body.append(overlay);modal=overlay;return overlay.querySelector('.inside')}
function openStore(collection=false){const inside=popup(collection?'Ma collection':'Boutique — objets à débloquer');const p=document.createElement('p');p.textContent=collection?'Tes objets achetés restent ici, même après avoir quitté le site.':'Solde : '+save.coins+' 🪙 — Chaque achat retire les pièces correspondantes.';inside.append(p);const grid=document.createElement('div');grid.className='shopgrid';inside.append(grid);for(const r of rewards){const owned=save.owned.includes(r.id);if(collection&&!owned)continue;const card=document.createElement('div');card.className='item';const preview=document.createElement('img');preview.src=url(r.file);preview.alt=r.name;if(!owned)preview.className='locked';card.append(preview);const label=document.createElement('strong');label.textContent=r.name;card.append(label);const price=document.createElement('span');price.textContent=owned?'✓ Acheté':r.cost+' 🪙';card.append(price);const b=document.createElement('button');b.className='xp';b.textContent=owned?'Voir / écouter':save.coins>=r.cost?'Acheter':'Pièces insuffisantes';b.dataset.action=owned?(r.type==='album'?'listen':'view'):'buy';b.setAttribute('aria-label',b.textContent);b.disabled=!owned&&save.coins<r.cost;b.onclick=()=>{if(owned){openReward(r,collection);return}if(save.coins<r.cost)return;save.coins-=r.cost;save.owned.push(r.id);persist();openStore(collection)};card.append(b);grid.append(card)}if(collection&&!grid.children.length){const p=document.createElement('p');p.textContent='Ta collection est vide pour le moment. Gagne des pièces et visite la boutique !';inside.append(p)}}
let lastRewardCollection=false;
function openReward(r,fromCollection=false){lastRewardCollection=fromCollection;const inside=popup(r.name,true);const bar=modal.querySelector('.bar');const back=document.createElement('button');back.className='back-to-list';back.textContent='← '+(fromCollection?'Collection':'Boutique');back.onclick=()=>openStore(fromCollection);bar.insertBefore(back,bar.querySelector('.close'));if(r.type==='image'){const img=document.createElement('img');img.src=url(r.file);img.alt=r.name;inside.append(img)}else if(r.type==='video'){const video=document.createElement('video');video.src=url(r.file);video.controls=true;video.autoplay=true;video.playsInline=true;inside.append(video)}else{const layout=document.createElement('div');layout.className='album';const cover=document.createElement('img');cover.src=url(r.file);cover.alt='Pochette de la Mixtape du Canapé';const right=document.createElement('div');right.className='tracks';const audio=document.createElement('audio');audio.controls=true;audio.preload='none';const buttons=[];function play(i){audio.src=url(tracks[i]);audio.play().catch(()=>{});buttons.forEach((b,j)=>b.classList.toggle('active',i===j))}tracks.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t.replace(/\.mp3$/i,'');b.onclick=()=>play(i);buttons.push(b);right.append(b)});audio.addEventListener('ended',()=>{const i=buttons.findIndex(b=>b.classList.contains('active'));if(i>=0&&i<4)play(i+1)});right.append(audio);layout.append(cover,right);inside.append(layout)}}
document.querySelector('#shopBtn').onclick=()=>openStore(false);document.querySelector('#collectionBtn').onclick=()=>openStore(true);
</script></body></html>
